# GAFIME local source-build containers.
#
# GPU service:
#   docker compose run --build gafime-cuda-dev
#
# CPU/Core smoke service:
#   docker compose run --build gafime-core-smoke

services:
  gafime-cuda-dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EXTRA_PIP_PACKAGES: ""
    gpus: all
    environment:
      GAFIME_SKIP_ROCM: "1"
      STRICT_CPU: "1"
      STRICT_CUDA: "1"
    volumes:
      - ./data:/workspace/GAFIME/data
      - ./output:/workspace/GAFIME/output
    working_dir: /workspace/GAFIME
    stdin_open: true
    tty: true

  gafime-core-smoke:
    build:
      context: .
      dockerfile: Dockerfile.smoketest
    environment:
      GAFIME_SKIP_CUDA: "1"
      GAFIME_SKIP_ROCM: "1"
      STRICT_CPU: "1"
    volumes:
      - ./data:/workspace/GAFIME/data
      - ./output:/workspace/GAFIME/output
    working_dir: /workspace/GAFIME
