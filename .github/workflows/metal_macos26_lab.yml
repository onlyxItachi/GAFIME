name: Metal macOS 26 Lab

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: "macOS runner label. Use macos-26 by default; use macos-26-xlarge only when enabled for the repo."
        required: false
        default: "macos-26"
      python_version:
        description: "Python version used for the lab wheel smoke"
        required: false
        default: "3.11"
      cibw_build:
        description: "cibuildwheel selector for the lab build"
        required: false
        default: "cp311-*"

permissions:
  contents: read

env:
  RUST_VERSION: '1.89.0'

jobs:
  metal_lab:
    name: Metal lab on ${{ github.event.inputs.runner_label || vars.GAFIME_MACOS_METAL_RUNNER || 'macos-26' }}
    # Standard macOS 26 is Apple Silicon and available to public repositories.
    # Set repository variable GAFIME_MACOS_METAL_RUNNER=macos-26-xlarge, or use
    # workflow_dispatch.runner_label, once larger runners are enabled.
    runs-on: ${{ github.event.inputs.runner_label || vars.GAFIME_MACOS_METAL_RUNNER || 'macos-26' }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ github.event.inputs.python_version || '3.11' }}
          architecture: arm64

      - name: Collect runner and Apple Silicon specs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p metal-lab-results
          {
            echo "== uname =="
            uname -a
            echo
            echo "== sw_vers =="
            sw_vers
            echo
            echo "== architecture =="
            arch
            echo
            echo "== CPU =="
            sysctl -n machdep.cpu.brand_string || true
            sysctl hw.machine hw.model hw.physicalcpu hw.logicalcpu hw.memsize || true
            echo
            echo "== Xcode =="
            xcodebuild -version
            echo
            echo "== Metal tools =="
            xcrun --find metal
            xcrun --find metallib
            xcrun metal -v || true
            echo
            echo "== Python =="
            python - <<'PY'
          import platform
          import sys
          print(sys.version)
          print(sys.executable)
          print(platform.platform())
          print(platform.machine())
          PY
          } | tee metal-lab-results/runner-specs.txt

      - name: Probe Metal device directly
        shell: bash
        run: |
          set -euo pipefail
          probe_src="${RUNNER_TEMP:-/tmp}/gafime_metal_probe.mm"
          probe_bin="${RUNNER_TEMP:-/tmp}/gafime_metal_probe"
          cat > "$probe_src" <<'MM'
          #import <Foundation/Foundation.h>
          #import <Metal/Metal.h>
          #include <cstdio>

          int main() {
              @autoreleasepool {
                  id<MTLDevice> device = MTLCreateSystemDefaultDevice();
                  if (!device) {
                      fprintf(stderr, "No default Metal device found.\n");
                      return 2;
                  }
                  printf("device_name=%s\n", [[device name] UTF8String]);
                  printf("recommended_working_set_mb=%llu\n",
                         (unsigned long long)([device recommendedMaxWorkingSetSize] / (1024 * 1024)));
                  printf("has_unified_memory=%d\n", [device hasUnifiedMemory]);
                  printf("is_low_power=%d\n", [device isLowPower]);
                  printf("is_removable=%d\n", [device isRemovable]);
                  printf("supports_family_apple7=%d\n", [device supportsFamily:MTLGPUFamilyApple7]);
                  printf("supports_family_apple8=%d\n", [device supportsFamily:MTLGPUFamilyApple8]);
                  printf("supports_family_apple9=%d\n", [device supportsFamily:MTLGPUFamilyApple9]);
                  printf("max_threads_per_threadgroup=%lu\n",
                         (unsigned long)[device maxThreadsPerThreadgroup].width);
              }
              return 0;
          }
          MM
          clang++ -std=c++23 -fobjc-arc -framework Foundation -framework Metal \
            "$probe_src" -o "$probe_bin"
          "$probe_bin" | tee metal-lab-results/metal-device.txt

      - name: Compile Metal v1 payload
        shell: bash
        run: |
          set -euo pipefail
          cmake -S src/metal -B metal-lab-results/build-metal -DCMAKE_BUILD_TYPE=Release
          cmake --build metal-lab-results/build-metal --config Release --verbose

      - name: Install build tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cibuildwheel>=2.22.0"
          if ! command -v rustup >/dev/null 2>&1; then
            curl https://sh.rustup.rs -sSf \
              | sh -s -- -y --profile minimal --default-toolchain "${{ env.RUST_VERSION }}"
          fi
          "$HOME/.cargo/bin/rustup" toolchain install "${{ env.RUST_VERSION }}" --profile minimal
          "$HOME/.cargo/bin/rustup" default "${{ env.RUST_VERSION }}"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache Rust
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: metal-lab-rust-${{ env.RUST_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            metal-lab-rust-${{ env.RUST_VERSION }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Build one macOS arm64 wheel
        shell: bash
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: ${{ github.event.inputs.cibw_build || 'cp311-*' }}
          CIBW_ARCHS_MACOS: arm64
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_BEFORE_ALL_MACOS: "source $HOME/.cargo/env || true"
          CIBW_ENVIRONMENT_MACOS: "GAFIME_SKIP_CUDA=1 STRICT_CPU=1 PATH=$HOME/.cargo/bin:$PATH"
          CIBW_TEST_REQUIRES: ""
          CIBW_TEST_COMMAND: >-
            python "{project}/tests/release_measure/installed_wheel_smoke.py" --source-root "{project}" &&
            python "{project}/tests/release_measure/installed_payload_smoke.py" --source-root "{project}" --backend metal --execute-metal

      - name: Inspect wheel native payloads
        shell: bash
        run: |
          set -euo pipefail
          for whl in wheelhouse/*.whl; do
            echo "=== $(basename "$whl") ===" | tee -a metal-lab-results/wheel-contents.txt
            python -m zipfile -l "$whl" \
              | grep -E '\.(so|dylib|metallib|pyd)$' \
              | tee -a metal-lab-results/wheel-contents.txt \
              || echo "  (no native binaries found!)" | tee -a metal-lab-results/wheel-contents.txt
            echo | tee -a metal-lab-results/wheel-contents.txt
          done

      - name: Installed wheel Metal smoke
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .metal-wheel-smoke
          . .metal-wheel-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install wheelhouse/*.whl
          (
            cd /tmp
            python "$GITHUB_WORKSPACE/tests/release_measure/installed_wheel_smoke.py" \
              --source-root "$GITHUB_WORKSPACE"
            python "$GITHUB_WORKSPACE/tests/release_measure/installed_payload_smoke.py" \
              --source-root "$GITHUB_WORKSPACE" \
              --backend metal \
              --execute-metal
          ) | tee metal-lab-results/installed-wheel-metal-smoke.txt

      - name: Installed wheel Metal public API stress
        shell: bash
        run: |
          set -euo pipefail
          . .metal-wheel-smoke/bin/activate
          (
            cd /tmp
            GAFIME_STRESS_OUTPUT="$GITHUB_WORKSPACE/metal-lab-results/installed-wheel-metal-stress.json" python - <<'PY'
          import json
          import math
          import os
          import random
          import time

          import gafime

          rng = random.Random(123)
          n_samples = 2048
          n_features = 12
          feature_names = [f"f{index}" for index in range(n_features)]
          features = []
          target = []
          for row_index in range(n_samples):
              row = [
                  float(
                      math.sin(0.007 * (feature_index + 1) * row_index)
                      + 0.55 * math.cos(0.011 * (feature_index + 2) * row_index)
                      + 0.06 * (((row_index * (feature_index + 3)) % 19) - 9)
                      + rng.uniform(-0.015, 0.015)
                  )
                  for feature_index in range(n_features)
              ]
              gate = 1.0 / (1.0 + math.exp(-10.0 * (row[2] - 0.20)))
              response = (
                  0.42 * row[0] * row[1]
                  + 0.20 * row[3] * row[4] * row[5]
                  + 1.25 * gate
                  + 0.08 * math.sin(row_index / 17.0)
                  + rng.uniform(-0.02, 0.02)
              )
              features.append(row)
              target.append(float(response))

          config = gafime.EngineConfig(
              backend="metal",
              metric_names=("pearson", "spearman", "mutual_info", "r2"),
              permutation_tests=0,
              num_repeats=1,
              random_seed=123,
              mi_bins=32,
              enable_time_series_functions=True,
              time_series_lags=(1, 2, 4, 8),
              time_series_windows=(4, 8, 16),
              budget=gafime.ComputeBudget(
                  max_comb_size=3,
                  max_combinations_per_k=1500,
                  top_features_for_higher_k=12,
                  max_generated_features=800,
                  keep_in_vram=False,
                  vram_budget_mb=4096,
                  max_time_series_candidates=500,
                  top_k_features_for_time_series=12,
              ),
          )

          def snapshot(report):
              if (
                  report.backend is None
                  or report.backend.name != "v1-metal-cabi"
                  or not report.backend.is_gpu
              ):
                  raise AssertionError(
                      f"expected v1-metal-cabi GPU backend, got {report.backend!r}"
                  )
              rows = {}
              families = {}
              for item in report.interactions:
                  metrics = {
                      str(name): float(value) for name, value in item.metrics.items()
                  }
                  if set(metrics) != {
                      "pearson",
                      "spearman",
                      "mutual_info",
                      "r2",
                  }:
                      raise AssertionError(
                          f"{item.candidate_id} returned metrics {sorted(metrics)}"
                      )
                  if not all(math.isfinite(value) for value in metrics.values()):
                      raise AssertionError(
                          f"{item.candidate_id} returned non-finite metrics {metrics}"
                      )
                  candidate_id = str(item.candidate_id)
                  if candidate_id in rows:
                      raise AssertionError(f"duplicate candidate id {candidate_id}")
                  family = str(item.family)
                  families[family] = families.get(family, 0) + 1
                  rows[candidate_id] = {
                      "family": family,
                      "combo": tuple(int(value) for value in item.combo),
                      "metrics": metrics,
                  }
              missing_families = {
                  "interaction",
                  "time_series",
              } - set(families)
              if missing_families:
                  raise AssertionError(
                      f"Metal stress run missed families {sorted(missing_families)}"
                  )
              return rows, families

          engine = gafime.GafimeEngine(config)
          started = time.perf_counter()
          eager = engine.analyze(features, target, feature_names)
          eager_seconds = time.perf_counter() - started
          eager_rows, families = snapshot(eager)

          started = time.perf_counter()
          compiled = engine.compile(features, target, feature_names)
          try:
              compiled_report = compiled.analyze()
          finally:
              compiled.close()
          compiled_seconds = time.perf_counter() - started
          compiled_rows, compiled_families = snapshot(compiled_report)

          if eager_rows.keys() != compiled_rows.keys():
              raise AssertionError("Metal eager and compiled candidate identities differ")
          for candidate_id, eager_row in eager_rows.items():
              compiled_row = compiled_rows[candidate_id]
              if (
                  eager_row["family"] != compiled_row["family"]
                  or eager_row["combo"] != compiled_row["combo"]
                  or eager_row["metrics"].keys() != compiled_row["metrics"].keys()
              ):
                  raise AssertionError(
                      f"Metal eager and compiled metadata differ for {candidate_id}"
                  )
              for metric, eager_value in eager_row["metrics"].items():
                  compiled_value = compiled_row["metrics"][metric]
                  if not math.isclose(
                      eager_value,
                      compiled_value,
                      rel_tol=0.0,
                      abs_tol=1.0e-7,
                  ):
                      raise AssertionError(
                          f"Metal eager and compiled {candidate_id} {metric} differ: "
                          f"{eager_value!r} != {compiled_value!r}"
                      )

          summary = {
              "version": gafime.__version__,
              "backend": eager.backend.name,
              "candidates": len(eager_rows),
              "families": families,
              "compiled_families": compiled_families,
              "eager_seconds": eager_seconds,
              "compiled_seconds": compiled_seconds,
          }
          with open(os.environ["GAFIME_STRESS_OUTPUT"], "w", encoding="utf-8") as output:
              json.dump(summary, output, indent=2, sort_keys=True)
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
          )
      - name: Upload Metal lab artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: metal-macos26-lab
          path: |
            metal-lab-results/**
            wheelhouse/*.whl
