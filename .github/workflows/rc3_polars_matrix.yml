name: RC3 bounded Polars version comparison

on:
  push:
    branches: [diagnostic/rc3-polars-matrix]

permissions:
  contents: read
  actions: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: diagnostic
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: 509d68a99a70182d117dad84eb905dae04764ec1
          path: source
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rc3-rss-attribution
          run-id: 38093562411
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/prior
      - name: Reuse authenticated wheel and prepare only dependency variants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/matrix"
          python diagnostic/tests/release_measure/diag_16_polars_matrix.py \
            --prepare --prior "$RUNNER_TEMP/prior" --output "$RUNNER_TEMP/matrix"
      - name: Matched same-host fresh-process version screen
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = 509d68a99a70182d117dad84eb905dae04764ec1
          python diagnostic/tests/release_measure/diag_16_polars_matrix.py \
            --prior "$RUNNER_TEMP/prior" --output "$RUNNER_TEMP/matrix"
      - name: Retain raw measurements without republishing datasets or packages
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rc3-polars-version-comparison
          path: ${{ runner.temp }}/matrix/
          retention-days: 30
          if-no-files-found: error
