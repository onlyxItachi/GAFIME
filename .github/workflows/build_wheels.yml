name: Build and Publish Wheels

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CUDA_VERSION: '13.2.0'

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    if: ${{ false }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        # ubuntu-latest = Linux x86_64
        # windows-latest = Windows x86_64
        # macos-14 = macOS arm64 (Apple Silicon)

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Cache CUDA Toolkit (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cuda-cache
        with:
          path: |
            C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA
          key: cuda-windows-${{ env.CUDA_VERSION }}

      - name: Setup CUDA Toolkit (Windows)
        if: runner.os == 'Windows' && steps.cuda-cache.outputs.cache-hit != 'true'
        uses: Jimver/cuda-toolkit@3d45d157f327c09c04b50ee6ccdea2d9d017ec76 # v0.2.35
        id: cuda-toolkit
        with:
          cuda: '13.2.0'

      - name: Add CUDA to PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v13.2\\bin" >> $GITHUB_PATH
          echo "CUDA_PATH=C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v13.2" >> $GITHUB_ENV

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel>=2.22.0"

      - name: Cache Rust
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/cpu/gafime_cpu/target
          key: rust-${{ runner.os }}-${{ hashFiles('src/cpu/gafime_cpu/Cargo.lock', 'src/cpu/gafime_cpu/Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_MACOS: "arm64"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_BEFORE_ALL_LINUX: "curl https://sh.rustup.rs -sSf | sh -s -- -y && . $HOME/.cargo/env && rpm --import https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/D42D0685.pub && curl -fsSL https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo -o /etc/yum.repos.d/cuda-rhel8.repo && dnf clean all && dnf install -y cuda-nvcc-13-2 cuda-cudart-devel-13-2 && ln -sfn /usr/local/cuda-13.2 /usr/local/cuda"
          CIBW_BEFORE_ALL_MACOS: "curl https://sh.rustup.rs -sSf | sh -s -- -y && source $HOME/.cargo/env"
          CIBW_BEFORE_ALL_WINDOWS: "rustup default stable"
          CIBW_BEFORE_BUILD_WINDOWS: "pip install delvewheel"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair -w {dest_dir} {wheel}"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_ENVIRONMENT: "STRICT_CPU=1 PATH=$HOME/.cargo/bin:$PATH"
          CIBW_ENVIRONMENT_LINUX: "CUDA_HOME=/usr/local/cuda CUDA_PATH=/usr/local/cuda PATH=$HOME/.cargo/bin:/usr/local/cuda/bin:$PATH LD_LIBRARY_PATH=/usr/local/cuda/lib64:$LD_LIBRARY_PATH STRICT_CPU=1 STRICT_CUDA=1"
          CIBW_ENVIRONMENT_WINDOWS: "STRICT_CPU=1 STRICT_CUDA=1"
          CIBW_TEST_REQUIRES: ""
          CIBW_TEST_COMMAND: "python {project}/tests/test_v045_native_spine.py"

      - name: List wheel contents
        shell: bash
        run: |
          for whl in wheelhouse/*.whl; do
            echo "=== $(basename "$whl") ==="
            python -m zipfile -l "$whl" | grep -E '\.(so|dll|dylib|pyd|metallib)$' || echo '  (no native binaries found!)'
            echo
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_arm_linux_wheels:
    name: Build ARM Linux wheels
    if: ${{ false }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          architecture: 'arm64'

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel>=2.22.0"

      - name: Cache Rust
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/cpu/gafime_cpu/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/cpu/gafime_cpu/Cargo.lock', 'src/cpu/gafime_cpu/Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-

      - name: Build ARM Linux wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_LINUX: "aarch64"
          CIBW_MANYLINUX_AARCH64_IMAGE: "manylinux_2_28"
          CIBW_BEFORE_ALL_LINUX: "curl https://sh.rustup.rs -sSf | sh -s -- -y && . $HOME/.cargo/env"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_ENVIRONMENT_LINUX: "GAFIME_SKIP_CUDA=1 STRICT_CPU=1 PATH=$HOME/.cargo/bin:$PATH"
          CIBW_TEST_REQUIRES: ""
          CIBW_TEST_COMMAND: "python {project}/tests/test_v045_native_spine.py"

      - name: List wheel contents
        shell: bash
        run: |
          for whl in wheelhouse/*.whl; do
            echo "=== $(basename "$whl") ==="
            python -m zipfile -l "$whl" | grep -E '\.(so|dll|dylib|pyd|metallib)$' || echo '  (no native binaries found!)'
            if python -m zipfile -l "$whl" | grep -E 'gafime_cuda|libgafime_cuda'; then
              echo "ARM Linux wheel must not contain NVIDIA CUDA payloads"
              exit 1
            fi
            echo
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cibw-wheels-ubuntu-24.04-arm
          path: ./wheelhouse/*.whl

  build_arm_windows_wheels:
    name: Build ARM Windows wheels
    if: ${{ false }}
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          architecture: 'arm64'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: arm64

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel>=2.22.0"

      - name: Cache Rust
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/cpu/gafime_cpu/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/cpu/gafime_cpu/Cargo.lock', 'src/cpu/gafime_cpu/Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-

      - name: Build ARM Windows wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_ARCHS_WINDOWS: "ARM64"
          CIBW_BEFORE_ALL_WINDOWS: "rustup default stable"
          CIBW_BEFORE_BUILD_WINDOWS: "pip install delvewheel"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair -w {dest_dir} {wheel}"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_ENVIRONMENT_WINDOWS: "GAFIME_SKIP_CUDA=1 STRICT_CPU=1"
          CIBW_TEST_REQUIRES: ""
          CIBW_TEST_COMMAND: "python {project}/tests/test_v045_native_spine.py"

      - name: List wheel contents
        shell: bash
        run: |
          for whl in wheelhouse/*.whl; do
            echo "=== $(basename "$whl") ==="
            python -m zipfile -l "$whl" | grep -E '\.(so|dll|dylib|pyd|metallib)$' || echo '  (no native binaries found!)'
            if python -m zipfile -l "$whl" | grep -E 'gafime_cuda|libgafime_cuda'; then
              echo "ARM Windows wheel must not contain NVIDIA CUDA payloads"
              exit 1
            fi
            echo
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cibw-wheels-windows-11-arm
          path: ./wheelhouse/*.whl

  benchmark_wheels:
    name: Benchmark wheel on ${{ matrix.label }}
    if: ${{ false }}
    needs: [build_wheels, build_arm_linux_wheels, build_arm_windows_wheels]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-latest
            python_arch: x64
            artifact: cibw-wheels-ubuntu-latest-0
            wheel_pattern: "gafime-0.4.6-cp311-cp311-manylinux_2_28_x86_64.whl"
          - label: linux-aarch64
            os: ubuntu-24.04-arm
            python_arch: arm64
            artifact: cibw-wheels-ubuntu-24.04-arm
            wheel_pattern: "gafime-0.4.6-cp311-cp311-manylinux_2_28_aarch64.whl"
          - label: macos-arm64
            os: macos-14
            python_arch: arm64
            artifact: cibw-wheels-macos-14-2
            wheel_pattern: "gafime-0.4.6-cp311-cp311-macosx_11_0_arm64.whl"
          - label: windows-amd64
            os: windows-latest
            python_arch: x64
            artifact: cibw-wheels-windows-latest-1
            wheel_pattern: "gafime-0.4.6-cp311-cp311-win_amd64.whl"
          - label: windows-arm64
            os: windows-11-arm
            python_arch: arm64
            artifact: cibw-wheels-windows-11-arm
            wheel_pattern: "gafime-0.4.6-cp311-cp311-win_arm64.whl"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python_arch }}

      - name: Download wheel artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.artifact }}
          path: wheelhouse

      - name: Install built wheel
        shell: bash
        run: |
          set -euo pipefail
          wheels=(wheelhouse/${{ matrix.wheel_pattern }})
          if [ "${#wheels[@]}" -ne 1 ] || [ ! -f "${wheels[0]}" ]; then
            echo "Expected exactly one wheel for ${{ matrix.wheel_pattern }}"
            find wheelhouse -maxdepth 1 -type f -name '*.whl' -print
            exit 1
          fi
          python -m pip install --upgrade pip
          python -m pip install "${wheels[0]}"
          echo "GAFIME_BENCHMARK_WHEEL=${wheels[0]}" >> "$GITHUB_ENV"

      - name: Run wheel benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-results
          python tests/benchmark_distribution_wheel.py \
            --label "${{ matrix.label }}" \
            --output "benchmark-results/${{ matrix.label }}.json"

      - name: Upload benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-benchmark-${{ matrix.label }}
          path: benchmark-results/*.json

  build_sdist:
    name: Build source distribution
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build sdist
        run: pipx run build --sdist

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  release:
    name: Publish to GitHub Releases
    needs: [build_wheels, build_arm_linux_wheels, build_arm_windows_wheels, benchmark_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: ${{ false }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Release Note
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          files: dist/*

  publish_pypi:
    name: Publish to PyPI
    needs: [build_wheels, build_arm_linux_wheels, build_arm_windows_wheels, benchmark_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: ${{ false }}
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: dist/
