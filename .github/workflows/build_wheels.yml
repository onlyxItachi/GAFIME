name: Build and Publish Wheels

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_pypi_core:
        description: "Publish the base gafime distribution to PyPI from this run"
        required: false
        type: boolean
        default: false
      publish_pypi_cuda:
        description: "Publish the gafime-cuda payload distribution to PyPI from this run"
        required: false
        type: boolean
        default: false
      publish_pypi_rocm:
        description: "Publish the gafime-rocm payload distribution to PyPI from this run"
        required: false
        type: boolean
        default: false
      publish_pypi_core_sdist:
        description: "Include the base gafime source distribution in the PyPI upload"
        required: false
        type: boolean
        default: true
      core_wheel_build_tag:
        description: "Optional wheel build tag for base gafime wheels, used when PyPI has blocked reused/deleted filenames"
        required: false
        type: string
        default: ""

env:
  CUDA_VERSION: '13.2.0'
  ROCM_VERSION: '7.2.3'
  ROCM_LINUX_APT_BUILD: '70203'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        # ubuntu-latest = Linux x86_64
        # windows-latest = Windows x86_64
        # macos-14 = macOS arm64 (Apple Silicon)

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel>=2.22.0"

      - name: Cache Rust
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/cpu/gafime_cpu/target
          key: rust-${{ runner.os }}-${{ hashFiles('src/cpu/gafime_cpu/Cargo.lock', 'src/cpu/gafime_cpu/Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_MACOS: "arm64"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_BEFORE_ALL_LINUX: "curl https://sh.rustup.rs -sSf | sh -s -- -y && . $HOME/.cargo/env"
          CIBW_BEFORE_ALL_MACOS: "curl https://sh.rustup.rs -sSf | sh -s -- -y && source $HOME/.cargo/env"
          CIBW_BEFORE_ALL_WINDOWS: "rustup default stable"
          CIBW_BEFORE_BUILD_WINDOWS: "pip install delvewheel"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair -w {dest_dir} {wheel}"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_ENVIRONMENT: "GAFIME_SKIP_CUDA=1 GAFIME_SKIP_ROCM=1 STRICT_CPU=1 PATH=$HOME/.cargo/bin:$PATH"
          CIBW_ENVIRONMENT_LINUX: "GAFIME_SKIP_CUDA=1 GAFIME_SKIP_ROCM=1 STRICT_CPU=1 PATH=$HOME/.cargo/bin:$PATH"
          CIBW_ENVIRONMENT_WINDOWS: "GAFIME_SKIP_CUDA=1 GAFIME_SKIP_ROCM=1 STRICT_CPU=1"
          CIBW_TEST_REQUIRES: ""
          CIBW_TEST_COMMAND: "python {project}/tests/test_v045_native_spine.py"

      - name: List wheel contents
        shell: bash
        run: |
          for whl in wheelhouse/*.whl; do
            echo "=== $(basename "$whl") ==="
            python -m zipfile -l "$whl" | grep -E '\.(so|dll|dylib|pyd|metallib)$' || echo '  (no native binaries found!)'
            if python -m zipfile -l "$whl" | grep -E 'gafime_cuda|gafime_rocm|libgafime_cuda|libgafime_rocm'; then
              echo "Base gafime wheel must not contain CUDA or ROCm payload packages"
              exit 1
            fi
            echo
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_arm_linux_wheels:
    name: Build ARM Linux wheels
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          architecture: 'arm64'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel>=2.22.0"

      - name: Cache Rust
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/cpu/gafime_cpu/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/cpu/gafime_cpu/Cargo.lock', 'src/cpu/gafime_cpu/Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-

      - name: Build ARM Linux wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_LINUX: "aarch64"
          CIBW_MANYLINUX_AARCH64_IMAGE: "manylinux_2_28"
          CIBW_BEFORE_ALL_LINUX: "curl https://sh.rustup.rs -sSf | sh -s -- -y && . $HOME/.cargo/env"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_ENVIRONMENT_LINUX: "GAFIME_SKIP_CUDA=1 GAFIME_SKIP_ROCM=1 STRICT_CPU=1 PATH=$HOME/.cargo/bin:$PATH"
          CIBW_TEST_REQUIRES: ""
          CIBW_TEST_COMMAND: "python {project}/tests/test_v045_native_spine.py"

      - name: List wheel contents
        shell: bash
        run: |
          for whl in wheelhouse/*.whl; do
            echo "=== $(basename "$whl") ==="
            python -m zipfile -l "$whl" | grep -E '\.(so|dll|dylib|pyd|metallib)$' || echo '  (no native binaries found!)'
            if python -m zipfile -l "$whl" | grep -E 'gafime_cuda|gafime_rocm|libgafime_cuda|libgafime_rocm'; then
              echo "ARM Linux wheel must not contain CUDA or ROCm payload packages"
              exit 1
            fi
            echo
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cibw-wheels-ubuntu-24.04-arm
          path: ./wheelhouse/*.whl

  build_arm_windows_wheels:
    name: Build ARM Windows wheels
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          architecture: 'arm64'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: arm64

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel>=2.22.0"

      - name: Cache Rust
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/cpu/gafime_cpu/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/cpu/gafime_cpu/Cargo.lock', 'src/cpu/gafime_cpu/Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-

      - name: Build ARM Windows wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_ARCHS_WINDOWS: "ARM64"
          CIBW_BEFORE_ALL_WINDOWS: "rustup default stable"
          CIBW_BEFORE_BUILD_WINDOWS: "pip install delvewheel"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair -w {dest_dir} {wheel}"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_ENVIRONMENT_WINDOWS: "GAFIME_SKIP_CUDA=1 GAFIME_SKIP_ROCM=1 STRICT_CPU=1"
          CIBW_TEST_REQUIRES: ""
          CIBW_TEST_COMMAND: "python {project}/tests/test_v045_native_spine.py"

      - name: List wheel contents
        shell: bash
        run: |
          for whl in wheelhouse/*.whl; do
            echo "=== $(basename "$whl") ==="
            python -m zipfile -l "$whl" | grep -E '\.(so|dll|dylib|pyd|metallib)$' || echo '  (no native binaries found!)'
            if python -m zipfile -l "$whl" | grep -E 'gafime_cuda|gafime_rocm|libgafime_cuda|libgafime_rocm'; then
              echo "ARM Windows wheel must not contain CUDA or ROCm payload packages"
              exit 1
            fi
            echo
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cibw-wheels-windows-11-arm
          path: ./wheelhouse/*.whl

  build_cuda_payload_wheels:
    name: Build CUDA ${{ matrix.platform.label }} payload wheels
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Cache CUDA Toolkit (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cuda-cache
        with:
          path: |
            C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA
          key: cuda-windows-${{ env.CUDA_VERSION }}

      - name: Setup CUDA Toolkit (Windows)
        if: runner.os == 'Windows' && steps.cuda-cache.outputs.cache-hit != 'true'
        uses: Jimver/cuda-toolkit@3d45d157f327c09c04b50ee6ccdea2d9d017ec76 # v0.2.35
        with:
          cuda: '13.2.0'

      - name: Add CUDA to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cudaRoot = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.2"
          $cudaLink = "C:\cuda-13.2"
          if (!(Test-Path $cudaRoot)) {
            throw "CUDA Toolkit not found at $cudaRoot"
          }
          if (!(Test-Path $cudaLink)) {
            New-Item -ItemType Junction -Path $cudaLink -Target $cudaRoot | Out-Null
          }
          "$cudaLink\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CUDA_PATH=$cudaLink" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel>=2.22.0"

      - name: Stage CUDA payload source
        run: python .github/scripts/stage_gpu_payload.py cuda payload-src/gafime-cuda

      - name: Build CUDA payload wheels
        run: python -m cibuildwheel payload-src/gafime-cuda --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_BEFORE_ALL_LINUX: "rpm --import https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/D42D0685.pub && curl -fsSL https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo -o /etc/yum.repos.d/cuda-rhel8.repo && dnf clean all && dnf install -y cuda-nvcc-13-2 cuda-cudart-devel-13-2 && ln -sfn /usr/local/cuda-13.2 /usr/local/cuda"
          CIBW_BEFORE_BUILD_WINDOWS: "pip install delvewheel"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair -w {dest_dir} {wheel}"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_ENVIRONMENT_LINUX: "CUDA_HOME=/usr/local/cuda CUDA_PATH=/usr/local/cuda PATH=/usr/local/cuda/bin:$PATH LD_LIBRARY_PATH=/usr/local/cuda/lib64:$LD_LIBRARY_PATH"
          CIBW_ENVIRONMENT_WINDOWS: 'CUDA_PATH=C:\cuda-13.2'
          CIBW_TEST_COMMAND: ""

      - name: List CUDA payload wheel contents
        shell: bash
        run: |
          for whl in wheelhouse/*.whl; do
            echo "=== $(basename "$whl") ==="
            python -m zipfile -l "$whl" | grep -E 'gafime_cuda/(libgafime_cuda\.so|gafime_cuda\.dll|gafime_cuda\.pyd)' || {
              echo "CUDA payload wheel does not contain the CUDA native library"
              exit 1
            }
            if python -m zipfile -l "$whl" | grep -E 'gafime_rocm|libgafime_rocm'; then
              echo "CUDA payload wheel must not contain ROCm payloads"
              exit 1
            fi
            echo
          done

      - name: Upload CUDA payload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cibw-cuda-${{ matrix.platform.label }}-wheels
          path: ./wheelhouse/*.whl

  build_rocm_linux_payload_wheels:
    name: Build ROCm Linux payload wheels with ROCm 7.2.3
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install ROCm 7.2.3 HIP toolchain
        shell: bash
        run: |
          set -euo pipefail
          amdgpu_install="amdgpu-install_${ROCM_VERSION}.${ROCM_LINUX_APT_BUILD}-1_all.deb"
          curl -fsSLO "https://repo.radeon.com/amdgpu-install/${ROCM_VERSION}/ubuntu/noble/${amdgpu_install}"
          sudo apt-get update
          sudo apt-get install -y "./${amdgpu_install}"
          sudo install -d -m 0755 /etc/apt/keyrings
          sudo rm -f /etc/apt/keyrings/rocm.gpg
          curl -fsSL https://repo.radeon.com/rocm/rocm.gpg.key | sudo gpg --batch --yes --dearmor -o /etc/apt/keyrings/rocm.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/${ROCM_VERSION} noble main" | sudo tee /etc/apt/sources.list.d/rocm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends hipcc hip-dev rocm-device-libs
          rocm_root="/opt/rocm"
          if [ ! -x "${rocm_root}/bin/hipcc" ] && [ -x "/opt/rocm-${ROCM_VERSION}/bin/hipcc" ]; then
            rocm_root="/opt/rocm-${ROCM_VERSION}"
          fi
          echo "${rocm_root}/bin" >> "$GITHUB_PATH"
          echo "ROCM_PATH=${rocm_root}" >> "$GITHUB_ENV"
          echo "HIP_PATH=${rocm_root}" >> "$GITHUB_ENV"
          "${rocm_root}/bin/hipcc" --version

      - name: Install build
        run: python -m pip install build wheel tomli

      - name: Stage ROCm payload source
        run: python .github/scripts/stage_gpu_payload.py rocm payload-src/gafime-rocm

      - name: Set up Python 3.10 for ROCm payload
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Build ROCm payload wheel for Python 3.10
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade build wheel tomli
          rm -rf payload-src/gafime-rocm/build
          python -m build --wheel payload-src/gafime-rocm --outdir wheelhouse
        env:
          LD_LIBRARY_PATH: /opt/rocm/lib:/opt/rocm-7.2.3/lib
          GAFIME_ROCM_ARCHS: linux-release
          GAFIME_ROCM_PLAT_NAME: manylinux_2_28_x86_64

      - name: Set up Python 3.11 for ROCm payload
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Build ROCm payload wheel for Python 3.11
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade build wheel tomli
          rm -rf payload-src/gafime-rocm/build
          python -m build --wheel payload-src/gafime-rocm --outdir wheelhouse
        env:
          LD_LIBRARY_PATH: /opt/rocm/lib:/opt/rocm-7.2.3/lib
          GAFIME_ROCM_ARCHS: linux-release
          GAFIME_ROCM_PLAT_NAME: manylinux_2_28_x86_64

      - name: Set up Python 3.12 for ROCm payload
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Build ROCm payload wheel for Python 3.12
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade build wheel tomli
          rm -rf payload-src/gafime-rocm/build
          python -m build --wheel payload-src/gafime-rocm --outdir wheelhouse
        env:
          LD_LIBRARY_PATH: /opt/rocm/lib:/opt/rocm-7.2.3/lib
          GAFIME_ROCM_ARCHS: linux-release
          GAFIME_ROCM_PLAT_NAME: manylinux_2_28_x86_64

      - name: Set up Python 3.13 for ROCm payload
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Build ROCm payload wheel for Python 3.13
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade build wheel tomli
          rm -rf payload-src/gafime-rocm/build
          python -m build --wheel payload-src/gafime-rocm --outdir wheelhouse
        env:
          LD_LIBRARY_PATH: /opt/rocm/lib:/opt/rocm-7.2.3/lib
          GAFIME_ROCM_ARCHS: linux-release
          GAFIME_ROCM_PLAT_NAME: manylinux_2_28_x86_64

      - name: Set up Python 3.14 for ROCm payload
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Build ROCm payload wheel for Python 3.14
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade build wheel tomli
          rm -rf payload-src/gafime-rocm/build
          python -m build --wheel payload-src/gafime-rocm --outdir wheelhouse
        env:
          LD_LIBRARY_PATH: /opt/rocm/lib:/opt/rocm-7.2.3/lib
          GAFIME_ROCM_ARCHS: linux-release
          GAFIME_ROCM_PLAT_NAME: manylinux_2_28_x86_64

      - name: List ROCm payload wheel contents
        shell: bash
        run: |
          for whl in wheelhouse/*.whl; do
            echo "=== $(basename "$whl") ==="
            if [[ "$(basename "$whl")" == *linux_x86_64.whl ]]; then
              echo "ROCm payload wheel has an unsupported raw linux_x86_64 platform tag"
              exit 1
            fi
            if [[ "$(basename "$whl")" != *manylinux_2_28_x86_64.whl ]]; then
              echo "ROCm payload wheel must use the manylinux_2_28_x86_64 platform tag"
              exit 1
            fi
            python -m zipfile -l "$whl" | grep -E 'gafime_rocm/(libgafime_rocm\.so|gafime_rocm\.dll|gafime_rocm\.pyd)' || {
              echo "ROCm payload wheel does not contain the ROCm native library"
              exit 1
            }
            if python -m zipfile -l "$whl" | grep -E 'gafime_cuda|libgafime_cuda'; then
              echo "ROCm payload wheel must not contain CUDA payloads"
              exit 1
            fi
            echo
          done

      - name: Upload ROCm payload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cibw-rocm-linux-wheels
          path: ./wheelhouse/*.whl

  benchmark_wheels:
    name: Benchmark wheel on ${{ matrix.label }}
    needs: [build_wheels, build_arm_linux_wheels, build_arm_windows_wheels]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-latest
            python_arch: x64
            artifact: cibw-wheels-ubuntu-latest-0
            wheel_pattern: "gafime-0.4.7-cp311-cp311-manylinux_2_28_x86_64.whl"
          - label: linux-aarch64
            os: ubuntu-24.04-arm
            python_arch: arm64
            artifact: cibw-wheels-ubuntu-24.04-arm
            wheel_pattern: "gafime-0.4.7-cp311-cp311-manylinux_2_28_aarch64.whl"
          - label: macos-arm64
            os: macos-14
            python_arch: arm64
            artifact: cibw-wheels-macos-14-2
            wheel_pattern: "gafime-0.4.7-cp311-cp311-macosx_11_0_arm64.whl"
          - label: windows-amd64
            os: windows-latest
            python_arch: x64
            artifact: cibw-wheels-windows-latest-1
            wheel_pattern: "gafime-0.4.7-cp311-cp311-win_amd64.whl"
          - label: windows-arm64
            os: windows-11-arm
            python_arch: arm64
            artifact: cibw-wheels-windows-11-arm
            wheel_pattern: "gafime-0.4.7-cp311-cp311-win_arm64.whl"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python_arch }}

      - name: Download wheel artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.artifact }}
          path: wheelhouse

      - name: Install built wheel
        shell: bash
        run: |
          set -euo pipefail
          wheels=(wheelhouse/${{ matrix.wheel_pattern }})
          if [ "${#wheels[@]}" -ne 1 ] || [ ! -f "${wheels[0]}" ]; then
            echo "Expected exactly one wheel for ${{ matrix.wheel_pattern }}"
            find wheelhouse -maxdepth 1 -type f -name '*.whl' -print
            exit 1
          fi
          python -m pip install --upgrade pip
          python -m pip install "${wheels[0]}"
          echo "GAFIME_BENCHMARK_WHEEL=${wheels[0]}" >> "$GITHUB_ENV"

      - name: Run wheel benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-results
          python tests/benchmark_distribution_wheel.py \
            --label "${{ matrix.label }}" \
            --output "benchmark-results/${{ matrix.label }}.json"

      - name: Upload benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-benchmark-${{ matrix.label }}
          path: benchmark-results/*.json

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build sdist
        run: pipx run build --sdist

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  build_payload_sdists:
    name: Build GPU payload source distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install build
        run: python -m pip install build tomli

      - name: Stage CUDA payload source
        run: python .github/scripts/stage_gpu_payload.py cuda payload-src/gafime-cuda

      - name: Stage ROCm payload source
        run: python .github/scripts/stage_gpu_payload.py rocm payload-src/gafime-rocm

      - name: Build payload sdists
        run: |
          python -m build --sdist payload-src/gafime-cuda --outdir dist
          python -m build --sdist payload-src/gafime-rocm --outdir dist

      - name: Validate payload sdist contents
        shell: bash
        run: |
          set -euo pipefail
          tar -tf dist/gafime_cuda-*.tar.gz | grep -E 'src/cuda/kernels\.cu'
          tar -tf dist/gafime_cuda-*.tar.gz | grep -E 'src/cuda/launcher\.cu'
          tar -tf dist/gafime_cuda-*.tar.gz | grep -E 'src/cuda/cuda_api\.hpp'
          tar -tf dist/gafime_cuda-*.tar.gz | grep -E 'src/common/gafime_gpu_abi\.hpp'
          tar -tf dist/gafime_cuda-*.tar.gz | grep -E 'gafime_cuda/__init__\.py'
          if tar -tf dist/gafime_cuda-*.tar.gz | grep -E 'gafime_rocm|src/rocm|libgafime_rocm'; then
            echo "CUDA payload source must not contain ROCm payloads"
            exit 1
          fi
          tar -tf dist/gafime_rocm-*.tar.gz | grep -E 'src/rocm/kernels\.hip'
          tar -tf dist/gafime_rocm-*.tar.gz | grep -E 'src/rocm/launcher\.hip'
          tar -tf dist/gafime_rocm-*.tar.gz | grep -E 'src/rocm/rocm_api\.hpp'
          tar -tf dist/gafime_rocm-*.tar.gz | grep -E 'src/common/gafime_gpu_abi\.hpp'
          tar -tf dist/gafime_rocm-*.tar.gz | grep -E 'gafime_rocm/__init__\.py'
          if tar -tf dist/gafime_rocm-*.tar.gz | grep -E 'gafime_cuda|src/cuda|libgafime_cuda'; then
            echo "ROCm payload source must not contain CUDA payloads"
            exit 1
          fi

      - name: Upload payload sdists
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cibw-payload-sdists
          path: dist/*.tar.gz

  release:
    name: Publish to GitHub Releases
    needs: [build_wheels, build_arm_linux_wheels, build_arm_windows_wheels, build_cuda_payload_wheels, build_rocm_linux_payload_wheels, benchmark_wheels, build_sdist, build_payload_sdists]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Release Note
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          files: dist/*

  publish_pypi_core:
    name: Publish base package to PyPI
    needs: [build_wheels, build_arm_linux_wheels, build_arm_windows_wheels, build_cuda_payload_wheels, build_rocm_linux_payload_wheels, benchmark_wheels, build_sdist, build_payload_sdists]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_pypi_core)
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Select base package distributions
        shell: bash
        env:
          CORE_WHEEL_BUILD_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.core_wheel_build_tag || '' }}
          PUBLISH_CORE_SDIST: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_pypi_core_sdist }}
        run: |
          set -euo pipefail
          mkdir -p publish-core
          find dist -type f -name 'gafime-*.whl' -exec cp {} publish-core/ \;
          if [ "$PUBLISH_CORE_SDIST" = "true" ]; then
            find dist -type f -name 'gafime-*.tar.gz' -exec cp {} publish-core/ \;
          else
            echo "Skipping base source distribution upload for this run."
          fi
          if find publish-core -type f | grep -E 'gafime_(cuda|rocm)-'; then
            echo "Base PyPI lane must not contain vendor payload distributions"
            exit 1
          fi
          if [ -n "$CORE_WHEEL_BUILD_TAG" ]; then
            python .github/scripts/retag_wheel_build.py --build-tag "$CORE_WHEEL_BUILD_TAG" --remove-original publish-core/*.whl
          fi
          count="$(find publish-core -type f | wc -l)"
          if [ "$count" -eq 0 ]; then
            echo "No base gafime distributions selected"
            exit 1
          fi
          find publish-core -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Publish base package to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: publish-core/
          skip-existing: true

  publish_pypi_cuda:
    name: Publish CUDA payload to PyPI
    needs: [build_wheels, build_arm_linux_wheels, build_arm_windows_wheels, build_cuda_payload_wheels, build_rocm_linux_payload_wheels, benchmark_wheels, build_sdist, build_payload_sdists]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_pypi_cuda)
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Select CUDA payload distributions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish-cuda
          find dist -type f \( -name 'gafime_cuda-*.whl' -o -name 'gafime_cuda-*.tar.gz' \) -exec cp {} publish-cuda/ \;
          if find publish-cuda -type f | grep -E 'gafime_rocm-'; then
            echo "CUDA PyPI lane must not contain ROCm payload distributions"
            exit 1
          fi
          count="$(find publish-cuda -type f | wc -l)"
          if [ "$count" -eq 0 ]; then
            echo "No gafime-cuda distributions selected"
            exit 1
          fi
          find publish-cuda -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Publish CUDA payload to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: publish-cuda/
          skip-existing: true

  publish_pypi_rocm:
    name: Publish ROCm payload to PyPI
    needs: [build_wheels, build_arm_linux_wheels, build_arm_windows_wheels, build_cuda_payload_wheels, build_rocm_linux_payload_wheels, benchmark_wheels, build_sdist, build_payload_sdists]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_pypi_rocm)
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Select ROCm payload distributions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish-rocm
          find dist -type f \( -name 'gafime_rocm-*.whl' -o -name 'gafime_rocm-*.tar.gz' \) -exec cp {} publish-rocm/ \;
          if find publish-rocm -type f | grep -E 'gafime_cuda-'; then
            echo "ROCm PyPI lane must not contain CUDA payload distributions"
            exit 1
          fi
          count="$(find publish-rocm -type f | wc -l)"
          if [ "$count" -eq 0 ]; then
            echo "No gafime-rocm distributions selected"
            exit 1
          fi
          find publish-rocm -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Publish ROCm payload to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: publish-rocm/
          skip-existing: true
