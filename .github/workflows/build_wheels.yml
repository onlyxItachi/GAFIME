name: Build Wheels Disabled

# Disabled while the Metal backend is being validated.
# This workflow intentionally does not build wheels or upload packages. Keep it
# as a visible placeholder so accidental distribution CI does not run while
# Metal work is active.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    name: Wheel workflow disabled
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled state
        run: |
          echo "Build wheel workflow is disabled while Metal validation is active."
          echo "Use .github/workflows/metal_macos26_lab.yml for Metal-only CI."
