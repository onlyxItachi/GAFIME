name: Build and Publish Wheels

on:
  pull_request:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_pypi_core:
        description: "Publish the base gafime distribution to PyPI from this run"
        required: false
        type: boolean
        default: false
      publish_pypi_cuda:
        description: "Publish the gafime-cuda payload distribution to PyPI from this run"
        required: false
        type: boolean
        default: false
      publish_pypi_rocm:
        description: "Publish the gafime-rocm payload distribution to PyPI from this run"
        required: false
        type: boolean
        default: false
      publish_github_release:
        description: "Recovery only: publish the frozen GitHub Release from an existing version tag after all three PyPI lanes succeed"
        required: false
        type: boolean
        default: false
      build_cuda_rt_payload:
        description: "Build the separate Linux OptiX RT-enabled CUDA artifact (requires OptiX URL and SHA-256 secrets)"
        required: false
        type: boolean
        default: false
      core_wheel_build_tag:
        description: "Optional ASCII wheel build tag ([0-9][A-Za-z0-9_]*), used when PyPI has blocked reused/deleted filenames"
        required: false
        type: string
        default: ""
      allow_matching_existing_pypi_files:
        description: "Recovery only: skip an existing PyPI filename after its SHA-256 matches the frozen artifact"
        required: false
        type: boolean
        default: false
      check_pypi_collisions:
        description: "Check the complete frozen bundle against live PyPI filenames during a publication-disabled dry run"
        required: false
        type: boolean
        default: true

env:
  CUDA_VERSION: '13.3.0'
  CUDA_RT_FIXTURE_IMAGE: 'docker.io/nvidia/cuda:13.3.0-devel-ubuntu24.04@sha256:69e9e39eb8fe2cda271654a0f5eac2f1bb946b2fb9c460eb19c7c3c155f4e64e'
  CUDA_RT_WHEEL_BUILDER_IMAGE: 'quay.io/pypa/manylinux_2_28_x86_64@sha256:a61875a2f84cab7df8de222ff12cabc08ff86eb4ad402ac90ba7bdaed9600cca'
  CUDA_RT_RPM_BASE_URL: 'https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64'
  CUDA_RT_RPM_MANIFEST: '.github/scripts/cuda_13_3_rpms.sha256'
  ROCM_VERSION: '7.2.3'
  RUST_VERSION: '1.89.0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build core wheel on ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux x86_64 (Ubuntu 24.04)
            artifact: cibw-wheels-linux-x86_64
          - os: windows-2025-vs2026
            label: Windows Server 2025 x86_64 (Visual Studio 2026)
            artifact: cibw-wheels-windows-x86_64
          - os: macos-26
            label: macOS 26 arm64
            artifact: cibw-wheels-macos-arm64

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Setup Visual Studio 2026 (Windows Server 2025)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Verify Visual Studio 2026 environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:VisualStudioVersion -notlike "18.*") {
            throw "Expected Visual Studio 2026 (18.x), found $env:VisualStudioVersion"
          }
          cl 2>&1 | Select-Object -First 3

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel>=2.22.0"

      - name: Cache Rust
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ env.RUST_VERSION }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            rust-${{ env.RUST_VERSION }}-${{ runner.os }}-

      - name: Stage bundled Metal payload
        if: runner.os == 'macOS'
        run: python .github/scripts/stage_metal_payload.py
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_MACOS: "arm64"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_BEFORE_ALL_LINUX: "curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain ${{ env.RUST_VERSION }} && . $HOME/.cargo/env"
          CIBW_BEFORE_ALL_MACOS: "curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain ${{ env.RUST_VERSION }} && source $HOME/.cargo/env"
          CIBW_BEFORE_ALL_WINDOWS: "rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal && rustup default ${{ env.RUST_VERSION }}"
          CIBW_BEFORE_BUILD_WINDOWS: "pip install delvewheel"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair -w {dest_dir} {wheel}"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_ENVIRONMENT: "GAFIME_SKIP_CUDA=1 GAFIME_SKIP_ROCM=1 STRICT_CPU=1 PATH=$HOME/.cargo/bin:$PATH"
          CIBW_ENVIRONMENT_LINUX: "GAFIME_SKIP_CUDA=1 GAFIME_SKIP_ROCM=1 STRICT_CPU=1 PATH=$HOME/.cargo/bin:$PATH"
          CIBW_ENVIRONMENT_MACOS: "GAFIME_SKIP_CUDA=1 GAFIME_SKIP_ROCM=1 STRICT_CPU=1 MACOSX_DEPLOYMENT_TARGET=11.0 PATH=$HOME/.cargo/bin:$PATH"
          CIBW_ENVIRONMENT_WINDOWS: "GAFIME_SKIP_CUDA=1 GAFIME_SKIP_ROCM=1 STRICT_CPU=1"
          CIBW_TEST_REQUIRES: ""
          CIBW_TEST_COMMAND: 'python "{project}/tests/release_measure/installed_wheel_smoke.py" --source-root "{project}"'
          CIBW_TEST_COMMAND_MACOS: 'python "{project}/tests/release_measure/installed_wheel_smoke.py" --source-root "{project}" && python "{project}/tests/release_measure/installed_payload_smoke.py" --source-root "{project}" --backend metal --execute-metal'

      - name: List wheel contents
        shell: bash
        run: |
          for whl in wheelhouse/*.whl; do
            echo "=== $(basename "$whl") ==="
            python -m zipfile -l "$whl" | grep -E '\.(so|dll|dylib|pyd|metallib)$' || echo '  (no native binaries found!)'
            if python -m zipfile -l "$whl" | grep -E 'gafime_cuda|gafime_rocm|libgafime_cuda|libgafime_rocm'; then
              echo "Base gafime wheel must not contain CUDA or ROCm payload packages"
              exit 1
            fi
            if [ "${{ runner.os }}" = "macOS" ]; then
              python -m zipfile -l "$whl" | grep -E 'gafime/_metal/libgafime_metal_v1\.dylib' || {
                echo "macOS arm64 base wheel is missing the bundled Metal dylib"
                exit 1
              }
              python -m zipfile -l "$whl" | grep -E 'gafime/_metal/gafime_metal_v1\.metallib' || {
                echo "macOS arm64 base wheel is missing the bundled Metal metallib"
                exit 1
              }
            fi
            echo
          done

      - name: Validate core wheel composition
        run: >-
          python tests/release_measure/artifact_01_release_composition.py
          --scope core-wheel
          --artifacts wheelhouse

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ./wheelhouse/*.whl

  build_arm_linux_wheels:
    name: Build ARM Linux wheels
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          architecture: 'arm64'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel>=2.22.0"

      - name: Cache Rust
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ env.RUST_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            rust-${{ env.RUST_VERSION }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Build ARM Linux wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_LINUX: "aarch64"
          CIBW_MANYLINUX_AARCH64_IMAGE: "manylinux_2_28"
          CIBW_BEFORE_ALL_LINUX: "curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain ${{ env.RUST_VERSION }} && . $HOME/.cargo/env"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_ENVIRONMENT_LINUX: "GAFIME_SKIP_CUDA=1 GAFIME_SKIP_ROCM=1 STRICT_CPU=1 PATH=$HOME/.cargo/bin:$PATH"
          CIBW_TEST_REQUIRES: ""
          CIBW_TEST_COMMAND: 'python "{project}/tests/release_measure/installed_wheel_smoke.py" --source-root "{project}"'

      - name: List wheel contents
        shell: bash
        run: |
          for whl in wheelhouse/*.whl; do
            echo "=== $(basename "$whl") ==="
            python -m zipfile -l "$whl" | grep -E '\.(so|dll|dylib|pyd|metallib)$' || echo '  (no native binaries found!)'
            if python -m zipfile -l "$whl" | grep -E 'gafime_cuda|gafime_rocm|libgafime_cuda|libgafime_rocm'; then
              echo "ARM Linux wheel must not contain CUDA or ROCm payload packages"
              exit 1
            fi
            echo
          done

      - name: Validate ARM Linux wheel composition
        run: >-
          python tests/release_measure/artifact_01_release_composition.py
          --scope core-wheel
          --artifacts wheelhouse

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cibw-wheels-ubuntu-24.04-arm
          path: ./wheelhouse/*.whl

  build_arm_windows_wheels:
    name: Build ARM Windows wheels
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          architecture: 'arm64'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: arm64

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel>=2.22.0"

      - name: Cache Rust
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ env.RUST_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            rust-${{ env.RUST_VERSION }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Build ARM Windows wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_ARCHS_WINDOWS: "ARM64"
          CIBW_BEFORE_ALL_WINDOWS: "rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal && rustup default ${{ env.RUST_VERSION }}"
          CIBW_BEFORE_BUILD_WINDOWS: "pip install delvewheel"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair -w {dest_dir} {wheel}"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_ENVIRONMENT_WINDOWS: "GAFIME_SKIP_CUDA=1 GAFIME_SKIP_ROCM=1 STRICT_CPU=1"
          CIBW_TEST_REQUIRES: ""
          CIBW_TEST_COMMAND: 'python "{project}/tests/release_measure/installed_wheel_smoke.py" --source-root "{project}"'

      - name: List wheel contents
        shell: bash
        run: |
          for whl in wheelhouse/*.whl; do
            echo "=== $(basename "$whl") ==="
            python -m zipfile -l "$whl" | grep -E '\.(so|dll|dylib|pyd|metallib)$' || echo '  (no native binaries found!)'
            if python -m zipfile -l "$whl" | grep -E 'gafime_cuda|gafime_rocm|libgafime_cuda|libgafime_rocm'; then
              echo "ARM Windows wheel must not contain CUDA or ROCm payload packages"
              exit 1
            fi
            echo
          done

      - name: Validate ARM Windows wheel composition
        run: >-
          python tests/release_measure/artifact_01_release_composition.py
          --scope core-wheel
          --artifacts wheelhouse

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cibw-wheels-windows-11-arm
          path: ./wheelhouse/*.whl

  build_cuda_payload_wheels:
    name: Build standard RT-off CUDA ${{ matrix.platform.label }} payload wheel
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-24.04
            label: Linux x86_64
            artifact: cibw-cuda-linux-wheels
          - os: windows-2025-vs2026
            label: Windows Server 2025 / Visual Studio 2026
            artifact: cibw-cuda-windows-wheels

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Setup Visual Studio 2026 (Windows Server 2025)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Verify Visual Studio 2026 environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:VisualStudioVersion -notlike "18.*") {
            throw "Expected Visual Studio 2026 (18.x), found $env:VisualStudioVersion"
          }
          cl 2>&1 | Select-Object -First 3

      - name: Cache CUDA Toolkit (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cuda-cache
        with:
          path: |
            C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA
          key: cuda-windows-${{ env.CUDA_VERSION }}

      - name: Setup CUDA Toolkit (Windows)
        if: runner.os == 'Windows' && steps.cuda-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "cuda-$env:CUDA_VERSION-network.exe"
          $url = "https://developer.download.nvidia.com/compute/cuda/$env:CUDA_VERSION/network_installers/cuda_$($env:CUDA_VERSION)_windows_network.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $componentVersion = (($env:CUDA_VERSION -split '\.')[0..1] -join '.')
          $process = Start-Process -FilePath $installer -ArgumentList @(
            "-s",
            "nvcc_$componentVersion",
            "crt_$componentVersion",
            "cudart_$componentVersion",
            "nvvm_$componentVersion"
          ) -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) {
            throw "CUDA Toolkit installer exited with code $($process.ExitCode)"
          }

      - name: Add CUDA to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cudaRoot = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.3"
          $cudaLink = "C:\cuda-13.3"
          if (!(Test-Path $cudaRoot)) {
            throw "CUDA Toolkit not found at $cudaRoot"
          }
          $requiredFiles = @(
            "$cudaRoot\bin\nvcc.exe",
            "$cudaRoot\include\crt\host_config.h",
            "$cudaRoot\nvvm\bin\cicc.exe",
            "$cudaRoot\lib\x64\cudart_static.lib"
          )
          foreach ($requiredFile in $requiredFiles) {
            if (!(Test-Path $requiredFile)) {
              throw "CUDA Toolkit component missing: $requiredFile"
            }
          }
          if (!(Test-Path $cudaLink)) {
            New-Item -ItemType Junction -Path $cudaLink -Target $cudaRoot | Out-Null
          }
          "$cudaLink\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CUDA_PATH=$cudaLink" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel>=2.22.0"

      - name: Stage CUDA payload source
        run: python .github/scripts/stage_gpu_payload.py cuda payload-src/gafime-cuda --cuda-rt off

      - name: Build CUDA payload wheels
        run: python -m cibuildwheel payload-src/gafime-cuda --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp310-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_BEFORE_ALL_LINUX: "rpm --import https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/D42D0685.pub && curl -fsSL https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo -o /etc/yum.repos.d/cuda-rhel8.repo && dnf clean all && dnf install -y cuda-nvcc-13-3 cuda-cudart-devel-13-3 && ln -sfn /usr/local/cuda-13.3 /usr/local/cuda"
          CIBW_BEFORE_BUILD_WINDOWS: "pip install delvewheel"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair -w {dest_dir} {wheel}"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_ENVIRONMENT_LINUX: "CUDA_HOME=/usr/local/cuda CUDA_PATH=/usr/local/cuda PATH=/usr/local/cuda/bin:$PATH LD_LIBRARY_PATH=/usr/local/cuda/lib64:$LD_LIBRARY_PATH GAFIME_CUDA_RT_BUILD_MODE=off"
          CIBW_ENVIRONMENT_WINDOWS: 'CUDA_PATH=C:\cuda-13.3 GAFIME_CUDA_RT_BUILD_MODE=off'
          CIBW_TEST_COMMAND: ""

      - name: List CUDA payload wheel contents
        shell: bash
        run: |
          for whl in wheelhouse/*.whl; do
            echo "=== $(basename "$whl") ==="
            python -m zipfile -l "$whl" | grep -E 'gafime_cuda/(libgafime_cuda\.so|gafime_cuda\.dll|gafime_cuda\.pyd)' || {
              echo "CUDA payload wheel does not contain the CUDA native library"
              exit 1
            }
            if python -m zipfile -l "$whl" | grep -E 'gafime_rocm|libgafime_rocm|gafime_cuda_rt|libgafime_cuda_rt'; then
              echo "Standard CUDA payload wheel must not contain ROCm or CUDA RT payloads"
              exit 1
            fi
            echo
          done

      - name: Validate standard CUDA artifact composition
        run: >-
          python tests/release_measure/artifact_01_release_composition.py
          --scope cuda-wheel
          --artifacts wheelhouse

      - name: Upload CUDA payload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.platform.artifact }}
          path: ./wheelhouse/*.whl

  build_cuda_rt_linux_payload:
    name: Build separately selected CUDA OptiX RT Linux artifacts
    needs: build_wheels
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_cuda_rt_payload == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: python -m pip install "cibuildwheel>=2.22.0" build

      - name: Stage immutable RT-enabled CUDA source
        shell: bash
        env:
          OPTIX_SDK_ARCHIVE_SHA256: ${{ secrets.GAFIME_OPTIX_SDK_ARCHIVE_SHA256 }}
        run: |
          set -euo pipefail
          python .github/scripts/stage_gpu_payload.py \
            cuda payload-src/gafime-cuda-rt \
            --cuda-rt on \
            --optix-sdk-archive-sha256 "$OPTIX_SDK_ARCHIVE_SHA256" \
            --cuda-fixture-image "$CUDA_RT_FIXTURE_IMAGE" \
            --wheel-builder-image "$CUDA_RT_WHEEL_BUILDER_IMAGE" \
            --cuda-rpm-base-url "$CUDA_RT_RPM_BASE_URL" \
            --cuda-rpm-manifest "$CUDA_RT_RPM_MANIFEST"

      - name: Supply licensed OptiX SDK headers
        shell: bash
        env:
          OPTIX_SDK_ARCHIVE_URL: ${{ secrets.GAFIME_OPTIX_SDK_ARCHIVE_URL }}
          OPTIX_SDK_ARCHIVE_SHA256: ${{ secrets.GAFIME_OPTIX_SDK_ARCHIVE_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "$OPTIX_SDK_ARCHIVE_URL" ]; then
            echo "The selected RT lane requires the GAFIME_OPTIX_SDK_ARCHIVE_URL secret."
            exit 1
          fi
          if [[ ! "$OPTIX_SDK_ARCHIVE_SHA256" =~ ^[0-9A-Fa-f]{64}$ ]]; then
            echo "The selected RT lane requires GAFIME_OPTIX_SDK_ARCHIVE_SHA256 as exactly 64 hex digits."
            exit 1
          fi
          archive="$RUNNER_TEMP/optix-sdk.tar.gz"
          curl --fail --location --silent --show-error \
            "$OPTIX_SDK_ARCHIVE_URL" \
            --output "$archive"
          printf '%s  %s\n' "${OPTIX_SDK_ARCHIVE_SHA256,,}" "$archive" \
            | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/optix-sdk"
          tar -xf "$archive" -C "$RUNNER_TEMP/optix-sdk"
          mapfile -t optix_headers < <(find "$RUNNER_TEMP/optix-sdk" -type f -name optix.h)
          if [ "${#optix_headers[@]}" -ne 1 ]; then
            echo "Expected exactly one OptiX include/optix.h, found ${#optix_headers[@]}."
            exit 1
          fi
          mkdir -p payload-src/gafime-cuda-rt/.optix-sdk
          cp -R "$(dirname "${optix_headers[0]}")" payload-src/gafime-cuda-rt/.optix-sdk/include
          test -f payload-src/gafime-cuda-rt/.optix-sdk/include/optix.h

      - name: Compile OptiX native lifecycle fixtures
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$CUDA_RT_FIXTURE_IMAGE" \
            bash -lc '
              set -euo pipefail
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cmake g++
              cmake -S src/cuda -B build/ci-cuda-rt-native \
                -DGAFIME_CUDA_RT_BUILD_MODE=on \
                -DGAFIME_CUDA_BUILD_TESTS=ON \
                -DGAFIME_CUDA_ARCHITECTURES=89-real \
                -DGAFIME_OPTIX_INCLUDE_DIR=/workspace/payload-src/gafime-cuda-rt/.optix-sdk/include
              cmake --build build/ci-cuda-rt-native --parallel 2
              cuda_driver_stub=$(find /usr/local/cuda -path "*/stubs/libcuda.so" -print -quit)
              test -n "$cuda_driver_stub"
              mkdir -p build/ci-cuda-driver-stub
              ln -s "$cuda_driver_stub" build/ci-cuda-driver-stub/libcuda.so.1
              LD_LIBRARY_PATH="/workspace/build/ci-cuda-driver-stub:${LD_LIBRARY_PATH:-}" \
                ctest --test-dir build/ci-cuda-rt-native --output-on-failure
            '

      - name: Build RT-enabled CUDA source distribution
        run: >-
          python -m build --sdist payload-src/gafime-cuda-rt
          --outdir rt-artifacts

      - name: Fetch hash-pinned CUDA wheel-builder RPMs
        shell: bash
        run: |
          set -euo pipefail
          rpm_dir="payload-src/gafime-cuda-rt/.cuda-rpms"
          mkdir -p "$rpm_dir"
          while read -r digest filename; do
            if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]] \
              || [[ ! "$filename" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*\.rpm$ ]]; then
              echo "Invalid CUDA RPM manifest entry: $digest $filename"
              exit 1
            fi
            curl --fail --location --silent --show-error \
              "$CUDA_RT_RPM_BASE_URL/$filename" \
              --output "$rpm_dir/$filename"
            printf '%s  %s\n' "$digest" "$rpm_dir/$filename" \
              | sha256sum --check --strict
          done < "$CUDA_RT_RPM_MANIFEST"
          test "$(find "$rpm_dir" -maxdepth 1 -type f -name '*.rpm' | wc -l)" -eq \
            "$(wc -l < "$CUDA_RT_RPM_MANIFEST")"

      - name: Build RT-enabled CUDA Linux wheel
        run: python -m cibuildwheel payload-src/gafime-cuda-rt --output-dir rt-artifacts
        env:
          CIBW_BUILD: "cp310-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ env.CUDA_RT_WHEEL_BUILDER_IMAGE }}
          CIBW_BEFORE_ALL_LINUX: >-
            test "$(command -v g++)" = "/opt/rh/gcc-toolset-14/root/usr/bin/g++" &&
            test "$(g++ -dumpfullversion -dumpversion)" = "14.2.1" &&
            rpm -Uvh --nodeps /project/payload-src/gafime-cuda-rt/.cuda-rpms/*.rpm &&
            ln -sfn /usr/local/cuda-13.3 /usr/local/cuda
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_ENVIRONMENT_LINUX: "CUDA_HOME=/usr/local/cuda CUDA_PATH=/usr/local/cuda PATH=/usr/local/cuda/bin:$PATH LD_LIBRARY_PATH=/usr/local/cuda/lib64:$LD_LIBRARY_PATH GAFIME_CUDA_RT_BUILD_MODE=on GAFIME_OPTIX_INCLUDE_DIR=/project/payload-src/gafime-cuda-rt/.optix-sdk/include"
          CIBW_TEST_COMMAND: ""

      - name: Validate selected RT artifact composition
        run: >-
          python tests/release_measure/artifact_01_release_composition.py
          --scope cuda-rt-release
          --artifacts rt-artifacts

      - name: Download Linux base wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cibw-wheels-linux-x86_64
          path: base-wheelhouse

      - name: Validate installed RT profile and ABI without GPU execution
        shell: bash
        run: |
          set -euo pipefail
          rt_wheels=(rt-artifacts/gafime_cuda_rt-*-cp310-abi3-*.whl)
          if [ "${#rt_wheels[@]}" -ne 1 ] || [ ! -f "${rt_wheels[0]}" ]; then
            echo "Expected exactly one gafime-cuda-rt Linux wheel"
            find rt-artifacts -type f -name '*.whl' -print
            exit 1
          fi
          python -m pip install base-wheelhouse/gafime-*-cp310-abi3-manylinux_2_28_x86_64.whl
          python -m pip install --no-deps "${rt_wheels[0]}"
          cp tests/release_measure/installed_payload_smoke.py "$RUNNER_TEMP/installed_payload_smoke.py"
          cd "$RUNNER_TEMP"
          python installed_payload_smoke.py \
            --source-root "$GITHUB_WORKSPACE" \
            --backend cuda \
            --cuda-rt on

      - name: Upload separately selected RT artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cuda-rt-linux-artifacts
          path: rt-artifacts/*

  build_rocm_linux_payload_wheels:
    name: Build ROCm Linux payload wheels with ROCm 7.2.3
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel>=2.22.0"

      - name: Stage ROCm payload source
        run: python .github/scripts/stage_gpu_payload.py rocm payload-src/gafime-rocm

      - name: Build and repair ROCm payload wheel
        run: python -m cibuildwheel payload-src/gafime-rocm --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp310-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_BEFORE_ALL_LINUX: >-
            printf '[rocm]\nname=ROCm 7.2.3\nbaseurl=https://repo.radeon.com/rocm/el8/7.2.3/main\nenabled=1\ngpgcheck=1\ngpgkey=https://repo.radeon.com/rocm/rocm.gpg.key\n'
            > /etc/yum.repos.d/rocm.repo &&
            rpm --import https://repo.radeon.com/rocm/rocm.gpg.key &&
            dnf install -y --setopt=install_weak_deps=False hip-devel7.2.3 rocm-device-libs7.2.3 libstdc++-devel &&
            dnf clean all
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair --plat manylinux_2_28_x86_64 -w {dest_dir} {wheel}"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_ENVIRONMENT_LINUX: "ROCM_PATH=/opt/rocm-7.2.3 HIP_PATH=/opt/rocm-7.2.3 PATH=/opt/rocm-7.2.3/bin:$PATH LD_LIBRARY_PATH=/opt/rocm-7.2.3/lib:$LD_LIBRARY_PATH GAFIME_ROCM_ARCHS=linux-release"
          CIBW_TEST_COMMAND: ""

      - name: List ROCm payload wheel contents
        shell: bash
        run: |
          for whl in wheelhouse/*.whl; do
            echo "=== $(basename "$whl") ==="
            if [[ "$(basename "$whl")" == *linux_x86_64.whl ]]; then
              echo "ROCm payload wheel has an unsupported raw linux_x86_64 platform tag"
              exit 1
            fi
            if [[ "$(basename "$whl")" != *manylinux_2_28_x86_64.whl ]]; then
              echo "ROCm payload wheel must use the manylinux_2_28_x86_64 platform tag"
              exit 1
            fi
            python -m zipfile -l "$whl" | grep -E 'gafime_rocm/(libgafime_rocm\.so|gafime_rocm\.dll|gafime_rocm\.pyd)' || {
              echo "ROCm payload wheel does not contain the ROCm native library"
              exit 1
            }
            if python -m zipfile -l "$whl" | grep -E 'gafime_cuda|libgafime_cuda'; then
              echo "ROCm payload wheel must not contain CUDA payloads"
              exit 1
            fi
            echo
          done

      - name: Validate ROCm artifact composition
        run: >-
          python tests/release_measure/artifact_01_release_composition.py
          --scope rocm-wheel
          --artifacts wheelhouse

      - name: Upload ROCm payload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cibw-rocm-linux-wheels
          path: ./wheelhouse/*.whl

  validate_wheels:
    name: Validate installed wheel on ${{ matrix.label }}
    needs: [build_wheels, build_arm_linux_wheels, build_arm_windows_wheels]
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-24.04
            python_arch: x64
            artifact: cibw-wheels-linux-x86_64
            wheel_pattern: "gafime-*-cp310-abi3-manylinux_2_28_x86_64.whl"
          - label: linux-aarch64
            os: ubuntu-24.04-arm
            python_arch: arm64
            artifact: cibw-wheels-ubuntu-24.04-arm
            wheel_pattern: "gafime-*-cp310-abi3-manylinux_2_28_aarch64.whl"
          - label: macos-arm64
            os: macos-26
            python_arch: arm64
            artifact: cibw-wheels-macos-arm64
            wheel_pattern: "gafime-*-cp310-abi3-macosx_11_0_arm64.whl"
          - label: windows-amd64
            os: windows-2025-vs2026
            python_arch: x64
            artifact: cibw-wheels-windows-x86_64
            wheel_pattern: "gafime-*-cp310-abi3-win_amd64.whl"
          - label: windows-arm64
            os: windows-11-arm
            python_arch: arm64
            artifact: cibw-wheels-windows-11-arm
            wheel_pattern: "gafime-*-cp310-abi3-win_arm64.whl"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python_arch }}

      - name: Download wheel artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.artifact }}
          path: wheelhouse

      - name: Install built wheel
        shell: bash
        run: |
          set -euo pipefail
          wheels=(wheelhouse/${{ matrix.wheel_pattern }})
          if [ "${#wheels[@]}" -ne 1 ] || [ ! -f "${wheels[0]}" ]; then
            echo "Expected exactly one wheel for ${{ matrix.wheel_pattern }}"
            find wheelhouse -maxdepth 1 -type f -name '*.whl' -print
            exit 1
          fi
          python -m pip install --upgrade pip
          python -m pip install "${wheels[0]}"

      - name: Probe clean installed wheel
        shell: bash
        run: |
          set -euo pipefail
          cp tests/release_measure/installed_wheel_smoke.py "$RUNNER_TEMP/installed_wheel_smoke.py"
          cd "$RUNNER_TEMP"
          python installed_wheel_smoke.py --source-root "$GITHUB_WORKSPACE"

      - name: Probe installed bundled Metal payload
        if: matrix.label == 'macos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          cp tests/release_measure/installed_payload_smoke.py "$RUNNER_TEMP/installed_payload_smoke.py"
          cd "$RUNNER_TEMP"
          python installed_payload_smoke.py \
            --source-root "$GITHUB_WORKSPACE" \
            --backend metal \
            --execute-metal

  validate_cuda_payload_wheels:
    name: Validate installed ${{ matrix.label }} payload artifacts
    needs: [build_wheels, build_cuda_payload_wheels]
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: cuda-linux
            os: ubuntu-24.04
            base_artifact: cibw-wheels-linux-x86_64
            base_pattern: "gafime-*-cp310-abi3-manylinux_2_28_x86_64.whl"
            payload_artifact: cibw-cuda-linux-wheels
            payload_pattern: "gafime_cuda-*-cp310-abi3-*.whl"
            backend: cuda
          - label: cuda-windows
            os: windows-2025-vs2026
            base_artifact: cibw-wheels-windows-x86_64
            base_pattern: "gafime-*-cp310-abi3-win_amd64.whl"
            payload_artifact: cibw-cuda-windows-wheels
            payload_pattern: "gafime_cuda-*-cp310-abi3-*.whl"
            backend: cuda
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Setup MSVC ABI tools (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Download base wheel artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.base_artifact }}
          path: base-wheelhouse

      - name: Download payload wheel artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.payload_artifact }}
          path: payload-wheelhouse

      - name: Install exact base and payload artifacts
        shell: bash
        run: |
          set -euo pipefail
          base_wheels=(base-wheelhouse/${{ matrix.base_pattern }})
          payload_wheels=(payload-wheelhouse/${{ matrix.payload_pattern }})
          if [ "${#base_wheels[@]}" -ne 1 ] || [ ! -f "${base_wheels[0]}" ]; then
            echo "Expected exactly one base wheel for ${{ matrix.base_pattern }}"
            find base-wheelhouse -type f -name '*.whl' -print
            exit 1
          fi
          if [ "${#payload_wheels[@]}" -ne 1 ] || [ ! -f "${payload_wheels[0]}" ]; then
            echo "Expected exactly one payload wheel for ${{ matrix.payload_pattern }}"
            find payload-wheelhouse -type f -name '*.whl' -print
            exit 1
          fi
          python -m pip install --upgrade pip
          python -m pip install "${base_wheels[0]}" "${payload_wheels[0]}"

      - name: Probe clean installed payload discovery and ABI
        shell: bash
        run: |
          set -euo pipefail
          cp tests/release_measure/installed_payload_smoke.py "$RUNNER_TEMP/installed_payload_smoke.py"
          cd "$RUNNER_TEMP"
          python installed_payload_smoke.py \
            --source-root "$GITHUB_WORKSPACE" \
            --backend "${{ matrix.backend }}"

  validate_rocm_payload_wheels:
    name: Validate installed ROCm Linux payload artifact
    needs: [build_wheels, build_rocm_linux_payload_wheels]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Download base wheel artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cibw-wheels-linux-x86_64
          path: base-wheelhouse

      - name: Download ROCm payload wheel artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cibw-rocm-linux-wheels
          path: payload-wheelhouse

      - name: Install exact base and ROCm payload artifacts
        shell: bash
        run: |
          set -euo pipefail
          base_wheels=(base-wheelhouse/gafime-*-cp310-abi3-manylinux_2_28_x86_64.whl)
          payload_wheels=(payload-wheelhouse/gafime_rocm-*-cp310-abi3-*.whl)
          if [ "${#base_wheels[@]}" -ne 1 ] || [ ! -f "${base_wheels[0]}" ]; then
            echo "Expected exactly one Linux x86_64 base wheel"
            find base-wheelhouse -type f -name '*.whl' -print
            exit 1
          fi
          if [ "${#payload_wheels[@]}" -ne 1 ] || [ ! -f "${payload_wheels[0]}" ]; then
            echo "Expected exactly one ROCm payload wheel"
            find payload-wheelhouse -type f -name '*.whl' -print
            exit 1
          fi
          python -m pip install --upgrade pip
          python -m pip install "${base_wheels[0]}" "${payload_wheels[0]}"

      - name: Probe clean installed ROCm payload discovery and ABI
        shell: bash
        run: |
          set -euo pipefail
          cp tests/release_measure/installed_payload_smoke.py "$RUNNER_TEMP/installed_payload_smoke.py"
          cd "$RUNNER_TEMP"
          python installed_payload_smoke.py \
            --source-root "$GITHUB_WORKSPACE" \
            --backend rocm

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build sdist
        run: pipx run build --sdist

      - name: Validate core sdist reproducibility sources
        run: >-
          python tests/release_measure/artifact_01_release_composition.py
          --scope core-sdist
          --artifacts dist

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  build_cuda_payload_sdist:
    name: Build CUDA payload source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install build
        run: python -m pip install build tomli

      - name: Stage CUDA payload source
        run: python .github/scripts/stage_gpu_payload.py cuda payload-src/gafime-cuda --cuda-rt off

      - name: Build CUDA payload sdist
        run: python -m build --sdist payload-src/gafime-cuda --outdir dist

      - name: Validate standard CUDA sdist composition
        run: >-
          python tests/release_measure/artifact_01_release_composition.py
          --scope cuda-sdist
          --artifacts dist
      - name: Upload CUDA payload sdist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cibw-cuda-sdist
          path: dist/gafime_cuda-*.tar.gz

  build_rocm_payload_sdist:
    name: Build ROCm payload source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install build
        run: python -m pip install build tomli

      - name: Stage ROCm payload source
        run: python .github/scripts/stage_gpu_payload.py rocm payload-src/gafime-rocm

      - name: Build ROCm payload sdist
        run: python -m build --sdist payload-src/gafime-rocm --outdir dist

      - name: Validate ROCm payload sdist composition
        run: >-
          python tests/release_measure/artifact_01_release_composition.py
          --scope rocm-sdist
          --artifacts dist

      - name: Upload ROCm payload sdist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cibw-rocm-sdist
          path: dist/gafime_rocm-*.tar.gz

  release_preflight:
    name: Shared release tag, version, and full-artifact preflight
    needs:
      - build_wheels
      - build_arm_linux_wheels
      - build_arm_windows_wheels
      - build_cuda_payload_wheels
      - build_rocm_linux_payload_wheels
      - validate_wheels
      - validate_cuda_payload_wheels
      - validate_rocm_payload_wheels
      - build_sdist
      - build_cuda_payload_sdist
      - build_rocm_payload_sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install release filename validator
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.core_wheel_build_tag != '' }}
        run: python -m pip install "packaging==25.0"

      - name: Download every standard release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Apply requested core wheel build tag before release freeze
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.core_wheel_build_tag != '' }}
        shell: bash
        env:
          CORE_WHEEL_BUILD_TAG: ${{ inputs.core_wheel_build_tag }}
        run: |
          set -euo pipefail
          python .github/scripts/retag_wheel_build.py \
            --build-tag "$CORE_WHEEL_BUILD_TAG" \
            --remove-original \
            dist/gafime-*.whl

      - name: Validate complete release bundle
        shell: bash
        env:
          PUBLISH_REQUESTED: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && (inputs.publish_pypi_core == true || inputs.publish_pypi_cuda == true || inputs.publish_pypi_rocm == true || inputs.publish_github_release == true)) }}
        run: |
          set -euo pipefail
          args=(
            --scope full-release
            --artifacts dist
            --github-ref "$GITHUB_REF"
            --git-sha "$GITHUB_SHA"
            --write-checksums dist/SHA256SUMS
          )
          if [ "$PUBLISH_REQUESTED" = "true" ]; then
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "Refusing to publish commit $GITHUB_SHA because it is not contained in origin/main."
              exit 1
            fi
            args+=(--require-release-tag)
          fi
          python tests/release_measure/artifact_01_release_composition.py "${args[@]}"
          cat dist/SHA256SUMS

      - name: Check frozen bundle against PyPI
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && inputs.check_pypi_collisions == true)
        env:
          ALLOW_MATCHING_EXISTING: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_matching_existing_pypi_files == true }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          args=(--artifacts dist --version "$version")
          if [ "$ALLOW_MATCHING_EXISTING" = "true" ]; then
            args+=(--allow-matching-existing)
          fi
          python .github/scripts/check_pypi_artifact_collisions.py "${args[@]}"

      - name: Freeze validated release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle
          if-no-files-found: error
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS

  release:
    name: Publish to GitHub Releases
    needs:
      - release_preflight
      - publish_pypi_cuda
      - publish_pypi_rocm
      - publish_pypi_core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: gafime-github-release-publication
      cancel-in-progress: false
    if: >-
      always() &&
      needs.release_preflight.result == 'success' &&
      needs.publish_pypi_cuda.result == 'success' &&
      needs.publish_pypi_rocm.result == 'success' &&
      needs.publish_pypi_core.result == 'success' &&
      (
        (
          github.event_name == 'push' &&
          startsWith(github.ref, 'refs/tags/v')
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          startsWith(github.ref, 'refs/tags/v') &&
          inputs.publish_github_release == true &&
          inputs.publish_pypi_core == true &&
          inputs.publish_pypi_cuda == true &&
          inputs.publish_pypi_rocm == true
        )
      )
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-bundle
          path: dist

      - name: Verify frozen bundle checksums
        run: cd dist && sha256sum --check SHA256SUMS

      - name: Release Note
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          files: dist/*
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') || contains(github.ref_name, '-') }}

  publish_pypi_core:
    name: Publish base package to PyPI
    needs:
      - release_preflight
      - publish_pypi_cuda
      - publish_pypi_rocm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: gafime-pypi-core-publication
      cancel-in-progress: false
    if: >-
      always() &&
      needs.release_preflight.result == 'success' &&
      (
        (
          github.event_name == 'push' &&
          startsWith(github.ref, 'refs/tags/v') &&
          needs.publish_pypi_cuda.result == 'success' &&
          needs.publish_pypi_rocm.result == 'success'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.publish_pypi_core == true &&
          (inputs.publish_pypi_cuda == false || needs.publish_pypi_cuda.result == 'success') &&
          (inputs.publish_pypi_rocm == false || needs.publish_pypi_rocm.result == 'success')
        )
      )
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-bundle
          path: dist

      - name: Verify frozen bundle checksums
        run: cd dist && sha256sum --check SHA256SUMS

      - name: Select base package distributions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish-core
          find dist -type f -name 'gafime-*.whl' -exec cp {} publish-core/ \;
          find dist -type f -name 'gafime-*.tar.gz' -exec cp {} publish-core/ \;
          if find publish-core -type f | grep -E 'gafime_(cuda|rocm)-'; then
            echo "Base PyPI lane must not contain vendor payload distributions"
            exit 1
          fi
          python tests/release_measure/artifact_01_release_composition.py \
            --scope core-release \
            --artifacts publish-core
          find publish-core -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Check base package PyPI collisions
        env:
          ALLOW_MATCHING_EXISTING: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_matching_existing_pypi_files == true }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          args=(--artifacts publish-core --version "$version")
          if [ "$ALLOW_MATCHING_EXISTING" = "true" ]; then
            args+=(--allow-matching-existing)
          fi
          python .github/scripts/check_pypi_artifact_collisions.py "${args[@]}"

      - name: Upload base package to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: publish-core/
          skip-existing: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_matching_existing_pypi_files == true }}

  publish_pypi_cuda:
    name: Publish CUDA payload to PyPI
    needs: release_preflight
    runs-on: ubuntu-24.04
