name: Build and Validate Wheels

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      core_wheel_build_tag:
        description: "Optional ASCII core wheel build tag ([0-9][A-Za-z0-9_]*) selected before the bundle is frozen"
        required: false
        type: string
        default: ""

env:
  CUDA_VERSION: '13.3.0'
  CUDA_CUDART_VERSION: '13.3.29'
  CUDA_CUDART_LINUX_URL: 'https://developer.download.nvidia.com/compute/cuda/redist/cuda_cudart/linux-x86_64/cuda_cudart-linux-x86_64-13.3.29-archive.tar.xz'
  CUDA_CUDART_LINUX_SHA256: '1e59c4888267d27ba1a9bd0f3669a6439db1334a96e754cd9013c7c73e18dc9d'
  CUDA_CUDART_WINDOWS_URL: 'https://developer.download.nvidia.com/compute/cuda/redist/cuda_cudart/windows-x86_64/cuda_cudart-windows-x86_64-13.3.29-archive.zip'
  CUDA_CUDART_WINDOWS_SHA256: '1feb7dd266813ffe8dbc24e115183a5ac35a4795c8d34aca0df85ab616b64d9c'
  ROCM_VERSION: '7.2.3'
  ROCM_WHEEL_BUILDER_IMAGE: 'quay.io/pypa/manylinux_2_28_x86_64@sha256:a61875a2f84cab7df8de222ff12cabc08ff86eb4ad402ac90ba7bdaed9600cca'
  RUST_VERSION: '1.97.1'
  CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build core wheel on ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux x86_64 (Ubuntu 24.04)
            artifact: cibw-wheels-linux-x86_64
          - os: windows-2025-vs2026
            label: Windows Server 2025 x86_64 (Visual Studio 2026)
            artifact: cibw-wheels-windows-x86_64
          - os: macos-26
            label: macOS 26 arm64
            artifact: cibw-wheels-macos-arm64

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Setup Visual Studio 2026 (Windows Server 2025)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Verify Visual Studio 2026 environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:VisualStudioVersion -notlike "18.*") {
            throw "Expected Visual Studio 2026 (18.x), found $env:VisualStudioVersion"
          }
          cl 2>&1 | Select-Object -First 3

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel>=2.22.0"

      - name: Cache Rust
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-${{ env.RUST_VERSION }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            rust-${{ env.RUST_VERSION }}-${{ runner.os }}-

      - name: Stage bundled Metal payload
        if: runner.os == 'macOS'
        run: python .github/scripts/stage_metal_payload.py
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: ${{ env.CIBW_BUILD }}
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_MACOS: "arm64"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_BEFORE_ALL_LINUX: "curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain ${{ env.RUST_VERSION }} && . $HOME/.cargo/env"
          CIBW_BEFORE_ALL_MACOS: "curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain ${{ env.RUST_VERSION }} && source $HOME/.cargo/env"
          CIBW_BEFORE_ALL_WINDOWS: "rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal && rustup default ${{ env.RUST_VERSION }}"
          CIBW_BEFORE_BUILD_WINDOWS: "pip install delvewheel"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair -w {dest_dir} {wheel}"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_ENVIRONMENT: "GAFIME_SKIP_CUDA=1 GAFIME_SKIP_ROCM=1 STRICT_CPU=1 PATH=$HOME/.cargo/bin:$PATH"
          CIBW_ENVIRONMENT_LINUX: "GAFIME_SKIP_CUDA=1 GAFIME_SKIP_ROCM=1 STRICT_CPU=1 PATH=$HOME/.cargo/bin:$PATH"
          CIBW_ENVIRONMENT_MACOS: "GAFIME_SKIP_CUDA=1 GAFIME_SKIP_ROCM=1 STRICT_CPU=1 MACOSX_DEPLOYMENT_TARGET=11.0 PATH=$HOME/.cargo/bin:$PATH"
          CIBW_ENVIRONMENT_WINDOWS: "GAFIME_SKIP_CUDA=1 GAFIME_SKIP_ROCM=1 STRICT_CPU=1"
          CIBW_TEST_REQUIRES: ""
          CIBW_TEST_COMMAND: 'python "{project}/tests/release_measure/installed_wheel_smoke.py" --source-root "{project}"'
          CIBW_TEST_COMMAND_MACOS: 'python "{project}/tests/release_measure/installed_wheel_smoke.py" --source-root "{project}" && python "{project}/tests/release_measure/installed_payload_smoke.py" --source-root "{project}" --backend metal --execute-metal'

      - name: List wheel contents
        shell: bash
        run: |
          for whl in wheelhouse/*.whl; do
            echo "=== $(basename "$whl") ==="
            python -m zipfile -l "$whl" | grep -E '\.(so|dll|dylib|pyd|metallib)[[:space:]]' || echo '  (no native binaries found!)'
            if python -m zipfile -l "$whl" | grep -E 'gafime_cuda|gafime_rocm|libgafime_cuda|libgafime_rocm'; then
              echo "Base gafime wheel must not contain CUDA or ROCm payload packages"
              exit 1
            fi
            if [ "${{ runner.os }}" = "macOS" ]; then
              python -m zipfile -l "$whl" | grep -E 'gafime/_metal/libgafime_metal_v1\.dylib' || {
                echo "macOS arm64 core wheel is missing the bundled Metal dylib"
                exit 1
              }
              python -m zipfile -l "$whl" | grep -E 'gafime/_metal/gafime_metal_v1\.metallib' || {
                echo "macOS arm64 core wheel is missing the bundled Metal metallib"
                exit 1
              }
            fi
            echo
          done

      - name: Validate core wheel composition
        run: >-
          python tests/release_measure/artifact_01_release_composition.py
          --scope core-wheel
          --artifacts wheelhouse

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ./wheelhouse/*.whl

  build_arm_linux_wheels:
    name: Build ARM Linux wheels
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          architecture: 'arm64'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel>=2.22.0"

      - name: Cache Rust
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-${{ env.RUST_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            rust-${{ env.RUST_VERSION }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Build ARM Linux wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: ${{ env.CIBW_BUILD }}
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_LINUX: "aarch64"
          CIBW_MANYLINUX_AARCH64_IMAGE: "manylinux_2_28"
          CIBW_BEFORE_ALL_LINUX: "curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain ${{ env.RUST_VERSION }} && . $HOME/.cargo/env"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_ENVIRONMENT_LINUX: "GAFIME_SKIP_CUDA=1 GAFIME_SKIP_ROCM=1 STRICT_CPU=1 PATH=$HOME/.cargo/bin:$PATH"
          CIBW_TEST_REQUIRES: ""
          CIBW_TEST_COMMAND: 'python "{project}/tests/release_measure/installed_wheel_smoke.py" --source-root "{project}"'

      - name: List wheel contents
        shell: bash
        run: |
          for whl in wheelhouse/*.whl; do
            echo "=== $(basename "$whl") ==="
            python -m zipfile -l "$whl" | grep -E '\.(so|dll|dylib|pyd|metallib)[[:space:]]' || echo '  (no native binaries found!)'
            if python -m zipfile -l "$whl" | grep -E 'gafime_cuda|gafime_rocm|libgafime_cuda|libgafime_rocm'; then
              echo "ARM Linux wheel must not contain CUDA or ROCm payload packages"
              exit 1
            fi
            echo
          done

      - name: Validate ARM Linux wheel composition
        run: >-
          python tests/release_measure/artifact_01_release_composition.py
          --scope core-wheel
          --artifacts wheelhouse

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cibw-wheels-ubuntu-24.04-arm
          path: ./wheelhouse/*.whl

  build_arm_windows_wheels:
    name: Build ARM Windows wheels
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up ARM64 Python 3.11 workflow host
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          architecture: 'arm64'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: arm64

      - name: Install pinned cibuildwheel NuGet provisioner
        run: python -m pip install "cibuildwheel==3.4.1"

      - name: Verify CPython 3.10 Windows ARM64 NuGet selection
        run: >-
          python .github/scripts/provision_windows_arm64_python.py
          --identifier cp310-win_arm64
          --resolve-only

      - name: Cache Rust
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-${{ env.RUST_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            rust-${{ env.RUST_VERSION }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Build ARM Windows wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: ${{ env.CIBW_BUILD }}
          CIBW_ARCHS_WINDOWS: "ARM64"
          CIBW_BEFORE_ALL_WINDOWS: "rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal && rustup default ${{ env.RUST_VERSION }}"
          CIBW_BEFORE_BUILD_WINDOWS: "pip install delvewheel"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair -w {dest_dir} {wheel}"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_ENVIRONMENT_WINDOWS: "GAFIME_SKIP_CUDA=1 GAFIME_SKIP_ROCM=1 STRICT_CPU=1"
          CIBW_TEST_REQUIRES: ""
          CIBW_TEST_COMMAND: 'python "{project}/tests/release_measure/installed_wheel_smoke.py" --source-root "{project}"'

      - name: List wheel contents
        shell: bash
        run: |
          for whl in wheelhouse/*.whl; do
            echo "=== $(basename "$whl") ==="
            python -m zipfile -l "$whl" | grep -E '\.(so|dll|dylib|pyd|metallib)[[:space:]]' || echo '  (no native binaries found!)'
            if python -m zipfile -l "$whl" | grep -E 'gafime_cuda|gafime_rocm|libgafime_cuda|libgafime_rocm'; then
              echo "ARM Windows wheel must not contain CUDA or ROCm payload packages"
              exit 1
            fi
            echo
          done

      - name: Validate ARM Windows wheel composition
        run: >-
          python tests/release_measure/artifact_01_release_composition.py
          --scope core-wheel
          --artifacts wheelhouse

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cibw-wheels-windows-11-arm
          path: ./wheelhouse/*.whl

  build_cuda_payload_wheels:
    name: Build CUDA ${{ matrix.platform.label }} payload wheel
    needs: build_wheels
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-24.04
            label: Linux x86_64
            artifact: cibw-cuda-linux-wheels
            base_artifact: cibw-wheels-linux-x86_64
          - os: windows-2025-vs2026
            label: Windows Server 2025 / Visual Studio 2026
            artifact: cibw-cuda-windows-wheels
            base_artifact: cibw-wheels-windows-x86_64

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Setup Visual Studio 2026 (Windows Server 2025)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Verify Visual Studio 2026 environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:VisualStudioVersion -notlike "18.*") {
            throw "Expected Visual Studio 2026 (18.x), found $env:VisualStudioVersion"
          }
          cl 2>&1 | Select-Object -First 3

      - name: Cache CUDA Toolkit (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cuda-cache
        with:
          path: |
            C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA
          key: cuda-windows-${{ env.CUDA_VERSION }}-components-nvcc-crt-nvvm-cuobjdump-nvdisasm-v1-cudart-${{ env.CUDA_CUDART_WINDOWS_SHA256 }}

      - name: Setup CUDA Toolkit (Windows)
        if: runner.os == 'Windows' && steps.cuda-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "cuda-$env:CUDA_VERSION-network.exe"
          $url = "https://developer.download.nvidia.com/compute/cuda/$env:CUDA_VERSION/network_installers/cuda_$($env:CUDA_VERSION)_windows_network.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $componentVersion = (($env:CUDA_VERSION -split '\.')[0..1] -join '.')
          $process = Start-Process -FilePath $installer -ArgumentList @(
            "-s",
            "nvcc_$componentVersion",
            "crt_$componentVersion",
            "nvvm_$componentVersion",
            "cuobjdump_$componentVersion",
            "nvdisasm_$componentVersion"
          ) -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) {
            throw "CUDA Toolkit installer exited with code $($process.ExitCode)"
          }

      - name: Install pinned CUDA runtime build dependency (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cudaRoot = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.3"
          $archive = Join-Path $env:RUNNER_TEMP "cuda-cudart-$env:CUDA_CUDART_VERSION.zip"
          $extractRoot = Join-Path $env:RUNNER_TEMP "cuda-cudart-$env:CUDA_CUDART_VERSION"

          Invoke-WebRequest -Uri $env:CUDA_CUDART_WINDOWS_URL -OutFile $archive
          $actualSha256 = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          $expectedSha256 = $env:CUDA_CUDART_WINDOWS_SHA256.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "CUDA runtime archive SHA-256 mismatch: expected $expectedSha256, got $actualSha256"
          }

          if (Test-Path $extractRoot) {
            Remove-Item -Path $extractRoot -Recurse -Force
          }
          Expand-Archive -Path $archive -DestinationPath $extractRoot -Force
          $runtimeRoots = @(Get-ChildItem -Path $extractRoot -Directory)
          if ($runtimeRoots.Count -ne 1) {
            throw "Expected one CUDA runtime archive root, found $($runtimeRoots.Count)"
          }
          $runtimeRoot = $runtimeRoots[0].FullName
          $runtimeDll = Join-Path $runtimeRoot "bin\x64\cudart64_13.dll"
          $runtimeImportLibrary = Join-Path $runtimeRoot "lib\x64\cudart.lib"
          $runtimeHeader = Join-Path $runtimeRoot "include\cuda_runtime.h"
          foreach ($requiredFile in @($runtimeDll, $runtimeImportLibrary, $runtimeHeader)) {
            if (!(Test-Path $requiredFile -PathType Leaf)) {
              throw "Pinned CUDA runtime archive component missing: $requiredFile"
            }
          }

          New-Item -ItemType Directory -Path "$cudaRoot\bin" -Force | Out-Null
          New-Item -ItemType Directory -Path "$cudaRoot\include" -Force | Out-Null
          New-Item -ItemType Directory -Path "$cudaRoot\lib\x64" -Force | Out-Null
          Copy-Item -Path (Join-Path $runtimeRoot "include\*") -Destination "$cudaRoot\include" -Recurse -Force
          Copy-Item -Path (Join-Path $runtimeRoot "lib\x64\*") -Destination "$cudaRoot\lib\x64" -Recurse -Force
          Copy-Item -Path $runtimeDll -Destination "$cudaRoot\bin\cudart64_13.dll" -Force

      - name: Add CUDA to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cudaRoot = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.3"
          $cudaLink = "C:\cuda-13.3"
          if (!(Test-Path $cudaRoot)) {
            throw "CUDA Toolkit not found at $cudaRoot"
          }
          $requiredFiles = @(
            "$cudaRoot\bin\nvcc.exe",
            "$cudaRoot\bin\cuobjdump.exe",
            "$cudaRoot\bin\nvdisasm.exe",
            "$cudaRoot\bin\cudart64_13.dll",
            "$cudaRoot\include\crt\host_config.h",
            "$cudaRoot\nvvm\bin\cicc.exe",
            "$cudaRoot\lib\x64\cudart.lib"
          )
          foreach ($requiredFile in $requiredFiles) {
            if (!(Test-Path $requiredFile)) {
              throw "CUDA Toolkit component missing: $requiredFile"
            }
          }
          if (!(Test-Path $cudaLink)) {
            New-Item -ItemType Junction -Path $cudaLink -Target $cudaRoot | Out-Null
          }
          "$cudaLink\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CUDA_PATH=$cudaLink" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel>=2.22.0"

      - name: Stage CUDA payload source
        run: python .github/scripts/stage_gpu_payload.py cuda payload-src/gafime-cuda

      - name: Download exact core wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.platform.base_artifact }}
          path: base-wheelhouse

      - name: Build CUDA payload wheels
        run: python -m cibuildwheel payload-src/gafime-cuda --output-dir wheelhouse
        env:
          CIBW_BUILD: ${{ env.CIBW_BUILD }}
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_BEFORE_ALL_LINUX: "rpm --import https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/D42D0685.pub && curl -fsSL https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo -o /etc/yum.repos.d/cuda-rhel8.repo && dnf clean all && dnf install -y cuda-nvcc-13-3 cuda-cudart-devel-13-3 cuda-cuobjdump-13-3 cuda-nvdisasm-13-3 && ln -sfn /usr/local/cuda-13.3 /usr/local/cuda"
          CIBW_BEFORE_BUILD_WINDOWS: "pip install delvewheel"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair --plat manylinux_2_28_x86_64 --exclude libcudart.so.13 -w {dest_dir} {wheel}"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: 'delvewheel repair --exclude "cudart64_13.dll;nvcudart_hybrid64.dll" -w {dest_dir} {wheel}'
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_ENVIRONMENT_LINUX: "CUDA_HOME=/usr/local/cuda CUDA_PATH=/usr/local/cuda PATH=/usr/local/cuda/bin:$PATH LD_LIBRARY_PATH=/usr/local/cuda/lib64:$LD_LIBRARY_PATH"
          CIBW_ENVIRONMENT_WINDOWS: 'CUDA_PATH=C:\cuda-13.3'
          CIBW_BEFORE_TEST_LINUX: 'command -v cuobjdump && command -v nvdisasm && python "{project}/.github/scripts/install_local_core_wheel.py" "{project}/base-wheelhouse"'
          CIBW_BEFORE_TEST_WINDOWS: 'where.exe cuobjdump.exe && where.exe nvdisasm.exe && python "{project}/.github/scripts/install_local_core_wheel.py" "{project}/base-wheelhouse"'
          CIBW_TEST_COMMAND_LINUX: 'python "{project}/tests/release_measure/installed_payload_smoke.py" --source-root "{project}" --backend cuda --machine-code-evidence-dir /output --machine-code-wheel "{wheel}"'
          CIBW_TEST_COMMAND_WINDOWS: 'python "{project}/tests/release_measure/installed_payload_smoke.py" --source-root "{project}" --backend cuda --machine-code-evidence-dir "{project}/precision-evidence" --machine-code-wheel "{wheel}"'

      - name: List CUDA payload wheel contents
        shell: bash
        run: |
          for whl in wheelhouse/*.whl; do
            echo "=== $(basename "$whl") ==="
            python -m zipfile -l "$whl" | grep -E 'gafime_cuda/(libgafime_cuda\.so|gafime_cuda\.dll|gafime_cuda\.pyd)' || {
              echo "CUDA payload wheel does not contain the CUDA native library"
              exit 1
            }
            if python -m zipfile -l "$whl" | grep -E 'gafime_rocm|libgafime_rocm'; then
              echo "CUDA payload wheel must not contain ROCm payloads"
              exit 1
            fi
            if python -m zipfile -l "$whl" | grep -Ei 'libcudart|cudart64_|nvcudart'; then
              echo "CUDA payload wheel must not bundle the CUDA runtime"
              exit 1
            fi
            echo
          done

      - name: Validate standard CUDA artifact composition
        run: >-
          python tests/release_measure/artifact_01_release_composition.py
          --scope cuda-wheel
          --artifacts wheelhouse

      - name: Upload CUDA profile machine-code evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cuda-profile-evidence-${{ runner.os }}
          if-no-files-found: error
          path: |
            ./precision-evidence/*.precision-evidence.json
            ./wheelhouse/*.precision-evidence.json

      - name: Upload CUDA payload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.platform.artifact }}
          path: ./wheelhouse/*.whl


  build_rocm_linux_payload_wheels:
    name: Build thin system-ROCm Linux payload with ROCm 7.2.3
    needs: build_wheels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel>=2.22.0"

      - name: Stage ROCm payload source
        run: >-
          python .github/scripts/stage_gpu_payload.py rocm payload-src/gafime-rocm
          --rocm-wheel-policy system

      - name: Download exact Linux core wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cibw-wheels-linux-x86_64
          path: base-wheelhouse

      - name: Build and test system-ROCm payload wheels
        run: python -m cibuildwheel payload-src/gafime-rocm --output-dir wheelhouse
        env:
          CIBW_BUILD: ${{ env.CIBW_BUILD }}
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ env.ROCM_WHEEL_BUILDER_IMAGE }}
          CIBW_BEFORE_ALL_LINUX: >-
            curl --fail --location --silent --show-error --output /tmp/rocm.gpg.key https://repo.radeon.com/rocm/rocm.gpg.key &&
            printf '2de99e2354646a90d9903e2a669fc4e36b02c1bbff7075c481e12d7edab2c88b  /tmp/rocm.gpg.key\n' | sha256sum --check --strict &&
            rpm --import /tmp/rocm.gpg.key &&
            printf '[rocm]\nname=ROCm 7.2.3\nbaseurl=https://repo.radeon.com/rocm/el8/7.2.3/main\nenabled=1\ngpgcheck=1\ngpgkey=file:///tmp/rocm.gpg.key\n'
            > /etc/yum.repos.d/rocm.repo &&
            dnf install -y --setopt=install_weak_deps=False
            hip-devel7.2.3-7.2.53211.70203-90.el8.x86_64
            rocm-device-libs7.2.3-1.0.0.70203-90.el8.x86_64
            libstdc++-devel-8.5.0-28.el8_10.alma.1.x86_64 &&
            dnf clean all
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "cp {wheel} {dest_dir}/"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_ENVIRONMENT_LINUX: "ROCM_PATH=/opt/rocm-7.2.3 HIP_PATH=/opt/rocm-7.2.3 PATH=/opt/rocm-7.2.3/lib/llvm/bin:/opt/rocm-7.2.3/bin:$PATH LD_LIBRARY_PATH=/opt/rocm-7.2.3/lib:$LD_LIBRARY_PATH GAFIME_ROCM_ARCHS=linux-release GAFIME_ROCM_WHEEL_POLICY=system"
          CIBW_BEFORE_TEST: 'command -v llvm-objcopy && command -v clang-offload-bundler && command -v llvm-readelf && python "{project}/.github/scripts/install_local_core_wheel.py" "{project}/base-wheelhouse"'
          CIBW_TEST_COMMAND: 'python "{project}/tests/release_measure/installed_payload_smoke.py" --source-root "{project}" --backend rocm --machine-code-evidence-dir /output --machine-code-wheel "{wheel}"'

      - name: List ROCm payload wheel contents
        shell: bash
        run: |
          for whl in wheelhouse/*.whl; do
            echo "=== $(basename "$whl") ==="
            if [[ "$(basename "$whl")" != *linux_x86_64.whl ]] \
              || [[ "$(basename "$whl")" == *manylinux* ]]; then
              echo "Thin ROCm payload must retain its truthful linux_x86_64 tag"
              exit 1
            fi
            python -m zipfile -l "$whl" | grep -E 'gafime_rocm/(libgafime_rocm\.so|gafime_rocm\.dll|gafime_rocm\.pyd)' || {
              echo "ROCm payload wheel does not contain the ROCm native library"
              exit 1
            }
            if python -m zipfile -l "$whl" | grep -E 'gafime_cuda|libgafime_cuda'; then
              echo "ROCm payload wheel must not contain CUDA payloads"
              exit 1
            fi
            if python -m zipfile -l "$whl" | grep -E 'gafime_rocm\.libs/|libamdhip|libhsa-runtime|libamd_comgr'; then
              echo "System ROCm payload wheel must not bundle ROCm userspace"
              exit 1
            fi
            echo
          done

      - name: Validate ROCm artifact composition
        run: |
          python tests/release_measure/artifact_01_release_composition.py \
            --scope rocm-wheel \
            --artifacts wheelhouse \
            --write-rocm-report wheelhouse/rocm-wheel-policy-report.json

      - name: Upload ROCm payload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cibw-rocm-linux-wheels
          path: ./wheelhouse/*.whl

      - name: Upload ROCm policy evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rocm-wheel-policy-report
          path: ./wheelhouse/rocm-wheel-policy-report.json

      - name: Upload ROCm profile machine-code evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rocm-profile-evidence
          if-no-files-found: error
          path: ./wheelhouse/*.precision-evidence.json

  validate_wheels:
    name: Validate installed wheel on ${{ matrix.platform.label }} / Python ${{ matrix.python_version }}
    needs: [build_wheels, build_arm_linux_wheels]
    if: ${{ needs.build_wheels.result == 'success' && needs.build_arm_linux_wheels.result == 'success' }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - label: linux-x86_64
            os: ubuntu-24.04
            python_arch: x64
            artifact: cibw-wheels-linux-x86_64
            wheel_suffix: "manylinux_2_28_x86_64.whl"
          - label: linux-aarch64
            os: ubuntu-24.04-arm
            python_arch: arm64
            artifact: cibw-wheels-ubuntu-24.04-arm
            wheel_suffix: "manylinux_2_28_aarch64.whl"
          - label: macos-arm64
            os: macos-26
            python_arch: arm64
            artifact: cibw-wheels-macos-arm64
            wheel_suffix: "macosx_11_0_arm64.whl"
          - label: windows-amd64
            os: windows-2025-vs2026
            python_arch: x64
            artifact: cibw-wheels-windows-x86_64
            wheel_suffix: "win_amd64.whl"
        python_version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python_version }}
          architecture: ${{ matrix.platform.python_arch }}

      - name: Download wheel artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.platform.artifact }}
          path: wheelhouse

      - name: Install built wheel
        shell: bash
        run: |
          set -euo pipefail
          python_tag="cp${{ matrix.python_version }}"
          python_tag="${python_tag/.}"
          wheel_pattern="gafime-*-${python_tag}-${python_tag}-${{ matrix.platform.wheel_suffix }}"
          wheels=()
          while IFS= read -r wheel; do
            wheels+=("$wheel")
          done < <(find wheelhouse -maxdepth 1 -type f -name "$wheel_pattern" -print)
          if [ "${#wheels[@]}" -ne 1 ] || [ ! -f "${wheels[0]}" ]; then
            echo "Expected exactly one wheel for ${wheel_pattern}"
            find wheelhouse -maxdepth 1 -type f -name '*.whl' -print
            exit 1
          fi
          python -m pip install --upgrade pip
          python -m pip install "${wheels[0]}"

      - name: Probe clean installed wheel
        shell: bash
        run: |
          set -euo pipefail
          cp tests/release_measure/installed_wheel_smoke.py "$RUNNER_TEMP/installed_wheel_smoke.py"
          cd "$RUNNER_TEMP"
          python installed_wheel_smoke.py --source-root "$GITHUB_WORKSPACE"

      - name: Run full Python suite from the fresh Core wheel
        if: matrix.platform.label == 'linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install numpy pyarrow polars scikit-learn pytest
          cd "$RUNNER_TEMP"
          GAFIME_TEST_INSTALLED_PACKAGE=1 python - <<'PY'
          import os
          import gafime
          import gafime.gafime_py
          import pytest

          raise SystemExit(
              pytest.main(["-q", os.path.join(os.environ["GITHUB_WORKSPACE"], "tests", "python")])
          )
          PY

      - name: Execute bundled Metal discovery and public API
        if: matrix.platform.label == 'macos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          cp tests/release_measure/installed_payload_smoke.py "$RUNNER_TEMP/installed_payload_smoke.py"
          cd "$RUNNER_TEMP"
          python installed_payload_smoke.py \
            --source-root "$GITHUB_WORKSPACE" \
            --backend metal \
            --execute-metal

  validate_windows_arm_wheel:
    name: Validate installed wheel on windows-arm64 / Python ${{ matrix.python_version }}
    needs: build_arm_windows_wheels
    if: ${{ needs.build_arm_windows_wheels.result == 'success' }}
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - python_version: "3.10"
            identifier: cp310-win_arm64
          - python_version: "3.11"
            identifier: cp311-win_arm64
          - python_version: "3.12"
            identifier: cp312-win_arm64
          - python_version: "3.13"
            identifier: cp313-win_arm64
          - python_version: "3.14"
            identifier: cp314-win_arm64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up ARM64 Python 3.11 workflow host
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          architecture: arm64

      - name: Install pinned cibuildwheel NuGet provisioner
        run: python -m pip install "cibuildwheel==3.4.1"

      - name: Provision target ARM64 interpreter from NuGet
        id: target_python
        run: >-
          python .github/scripts/provision_windows_arm64_python.py
          --identifier ${{ matrix.identifier }}
          --venv "$env:RUNNER_TEMP\gafime-target-${{ matrix.identifier }}"
          --github-output "$env:GITHUB_OUTPUT"
          --github-env "$env:GITHUB_ENV"

      - name: Download Windows ARM64 wheel artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cibw-wheels-windows-11-arm
          path: wheelhouse

      - name: Install built wheel
        shell: pwsh
        run: |
          $pythonTag = "${{ matrix.identifier }}".Split("-")[0]
          $wheelPattern = "gafime-*-$pythonTag-$pythonTag-win_arm64.whl"
          $wheels = @(Get-ChildItem wheelhouse -Filter $wheelPattern)
          if ($wheels.Count -ne 1) {
            Get-ChildItem wheelhouse -Filter "*.whl"
            throw "Expected exactly one $wheelPattern wheel, found $($wheels.Count)"
          }
          & $env:TARGET_PYTHON -m pip install --upgrade pip
          & $env:TARGET_PYTHON -m pip install $wheels[0].FullName

      - name: Probe clean installed wheel
        shell: pwsh
        run: |
          Copy-Item tests/release_measure/installed_wheel_smoke.py "$env:RUNNER_TEMP\installed_wheel_smoke.py"
          Push-Location $env:RUNNER_TEMP
          & $env:TARGET_PYTHON installed_wheel_smoke.py --source-root "$env:GITHUB_WORKSPACE"
          Pop-Location

  validate_cuda_payload_wheels:
    name: Validate installed ${{ matrix.platform.label }} payload / Python ${{ matrix.python_version }}
    needs: [build_wheels, build_cuda_payload_wheels]
    if: ${{ needs.build_wheels.result == 'success' && needs.build_cuda_payload_wheels.result == 'success' }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - label: cuda-linux
            os: ubuntu-24.04
            base_artifact: cibw-wheels-linux-x86_64
            base_suffix: "manylinux_2_28_x86_64.whl"
            payload_artifact: cibw-cuda-linux-wheels
            payload_suffix: "*manylinux_2_28_x86_64.whl"
            backend: cuda
          - label: cuda-windows
            os: windows-2025-vs2026
            base_artifact: cibw-wheels-windows-x86_64
            base_suffix: "win_amd64.whl"
            payload_artifact: cibw-cuda-windows-wheels
            payload_suffix: "win_amd64.whl"
            backend: cuda
        python_version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python_version }}

      - name: Setup MSVC ABI tools (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Download base wheel artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.platform.base_artifact }}
          path: base-wheelhouse

      - name: Download payload wheel artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.platform.payload_artifact }}
          path: payload-wheelhouse

      - name: Install exact base and payload artifacts
        shell: bash
        run: |
          set -euo pipefail
          python_tag="cp${{ matrix.python_version }}"
          python_tag="${python_tag/.}"
          base_pattern="gafime-*-${python_tag}-${python_tag}-${{ matrix.platform.base_suffix }}"
          payload_pattern="gafime_cuda-*-${python_tag}-${python_tag}-${{ matrix.platform.payload_suffix }}"
          base_wheels=()
          while IFS= read -r wheel; do
            base_wheels+=("$wheel")
          done < <(find base-wheelhouse -maxdepth 1 -type f -name "$base_pattern" -print)
          payload_wheels=()
          while IFS= read -r wheel; do
            payload_wheels+=("$wheel")
          done < <(find payload-wheelhouse -maxdepth 1 -type f -name "$payload_pattern" -print)
          if [ "${#base_wheels[@]}" -ne 1 ] || [ ! -f "${base_wheels[0]}" ]; then
            echo "Expected exactly one base wheel for ${base_pattern}"
            find base-wheelhouse -type f -name '*.whl' -print
            exit 1
          fi
          if [ "${#payload_wheels[@]}" -ne 1 ] || [ ! -f "${payload_wheels[0]}" ]; then
            echo "Expected exactly one payload wheel for ${payload_pattern}"
            find payload-wheelhouse -type f -name '*.whl' -print
            exit 1
          fi
          python -m pip install --upgrade pip
          python -m pip install "${base_wheels[0]}" "${payload_wheels[0]}"

      - name: Provision pinned CUDA runtime prerequisite (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cuda-cudart-$CUDA_CUDART_VERSION.tar.xz"
          runtime_root="$(mktemp -d "$RUNNER_TEMP/cuda-cudart-XXXXXX")"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "$CUDA_CUDART_LINUX_URL"
          printf '%s  %s\n' "$CUDA_CUDART_LINUX_SHA256" "$archive" \
            | sha256sum --check --strict
          tar --extract --xz --file "$archive" \
            --strip-components=1 \
            --directory "$runtime_root"
          test -f "$runtime_root/lib/libcudart.so.13"
          printf 'LD_LIBRARY_PATH=%s/lib:%s\n' \
            "$runtime_root" "${LD_LIBRARY_PATH:-}" \
            >> "$GITHUB_ENV"

      - name: Probe clean installed payload discovery and ABI
        shell: bash
        run: |
          set -euo pipefail
          cp tests/release_measure/installed_payload_smoke.py "$RUNNER_TEMP/installed_payload_smoke.py"
          cd "$RUNNER_TEMP"
          python installed_payload_smoke.py \
            --source-root "$GITHUB_WORKSPACE" \
            --backend "${{ matrix.platform.backend }}"

  validate_rocm_payload_wheels:
    name: Validate thin ROCm payload against pinned system runtime
    needs: [build_wheels, build_rocm_linux_payload_wheels]
    if: ${{ needs.build_wheels.result == 'success' && needs.build_rocm_linux_payload_wheels.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download base wheel artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cibw-wheels-linux-x86_64
          path: base-wheelhouse

      - name: Download ROCm payload wheel artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cibw-rocm-linux-wheels
          path: payload-wheelhouse

      - name: Validate installed pair on Python 3.10-3.14 in pinned ROCm 7.2.3 userspace
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/project" \
            -w /project \
            "$ROCM_WHEEL_BUILDER_IMAGE" \
            bash -lc '
              set -euo pipefail
              curl --fail --location --silent --show-error \
                --output /tmp/rocm.gpg.key \
                https://repo.radeon.com/rocm/rocm.gpg.key
              printf "2de99e2354646a90d9903e2a669fc4e36b02c1bbff7075c481e12d7edab2c88b  /tmp/rocm.gpg.key\n" \
                | sha256sum --check --strict
              rpm --import /tmp/rocm.gpg.key
              printf "[rocm]\nname=ROCm 7.2.3\nbaseurl=https://repo.radeon.com/rocm/el8/7.2.3/main\nenabled=1\ngpgcheck=1\ngpgkey=file:///tmp/rocm.gpg.key\n" \
                > /etc/yum.repos.d/rocm.repo
              dnf install -y --setopt=install_weak_deps=False \
                hip-devel7.2.3-7.2.53211.70203-90.el8.x86_64 \
                rocm-device-libs7.2.3-1.0.0.70203-90.el8.x86_64 \
                libstdc++-devel-8.5.0-28.el8_10.alma.1.x86_64
              export LD_LIBRARY_PATH=/opt/rocm-7.2.3/lib
              cp /project/tests/release_measure/installed_payload_smoke.py \
                /tmp/installed_payload_smoke.py
              for python_tag in \
                cp310 \
                cp311 \
                cp312 \
                cp313 \
                cp314
              do
                python_abi_tag="${python_tag}-${python_tag}"
                python="/opt/python/${python_abi_tag}/bin/python"
                core=(/project/base-wheelhouse/gafime-*-"${python_abi_tag}"-manylinux_2_28_x86_64.whl)
                payload=(/project/payload-wheelhouse/gafime_rocm-*-"${python_abi_tag}"-linux_x86_64.whl)
                if [ "${#core[@]}" -ne 1 ] || [ ! -f "${core[0]}" ]; then
                  echo "Expected one Core wheel for ${python_abi_tag}"
                  exit 1
                fi
                if [ "${#payload[@]}" -ne 1 ] || [ ! -f "${payload[0]}" ]; then
                  echo "Expected one ROCm wheel for ${python_abi_tag}"
                  exit 1
                fi
                "$python" -m pip install \
                  "${core[0]}" \
                  "${payload[0]}"
                (
                  cd /tmp
                  "$python" installed_payload_smoke.py \
                    --source-root /project \
                    --backend rocm
                )
              done
            '

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build sdist
        run: pipx run build --sdist

      - name: Validate core sdist reproducibility sources
        run: >-
          python tests/release_measure/artifact_01_release_composition.py
          --scope core-sdist
          --artifacts dist

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  build_cuda_payload_sdist:
    name: Build CUDA payload source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install build
        run: python -m pip install build tomli

      - name: Stage CUDA payload source
        run: python .github/scripts/stage_gpu_payload.py cuda payload-src/gafime-cuda

      - name: Build CUDA payload sdist
        run: python -m build --sdist payload-src/gafime-cuda --outdir dist

      - name: Validate standard CUDA sdist composition
        run: >-
          python tests/release_measure/artifact_01_release_composition.py
          --scope cuda-sdist
          --artifacts dist
      - name: Upload CUDA payload sdist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cibw-cuda-sdist
          path: dist/gafime_cuda-*.tar.gz

  build_rocm_payload_sdist:
    name: Build ROCm payload source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install build
        run: python -m pip install build tomli

      - name: Stage ROCm payload source
        run: >-
          python .github/scripts/stage_gpu_payload.py rocm payload-src/gafime-rocm
          --rocm-wheel-policy system

      - name: Build ROCm payload sdist
        run: python -m build --sdist payload-src/gafime-rocm --outdir dist

      - name: Validate ROCm payload sdist composition
        run: >-
          python tests/release_measure/artifact_01_release_composition.py
          --scope rocm-sdist
          --artifacts dist

      - name: Upload ROCm payload sdist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cibw-rocm-sdist
          path: dist/gafime_rocm-*.tar.gz

  freeze_release_bundle:
    name: Shared release tag, version, and full-artifact preflight
    needs:
      - build_wheels
      - build_arm_linux_wheels
      - build_arm_windows_wheels
      - build_cuda_payload_wheels
      - build_rocm_linux_payload_wheels
      - validate_wheels
      - validate_windows_arm_wheel
      - validate_cuda_payload_wheels
      - validate_rocm_payload_wheels
      - build_sdist
      - build_cuda_payload_sdist
      - build_rocm_payload_sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install cross-format ABI inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes llvm
          command -v llvm-nm
          command -v llvm-readobj

      - name: Install release filename and archive validators
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.core_wheel_build_tag != '' }}
        run: python -m pip install "installer==0.7.0" "packaging==25.0"

      - name: Validate SemVer and PEP 440 release identities
        run: python .github/scripts/release_version.py --check-project

      - name: Download every standard release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Download CUDA and ROCm profile machine-code evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*-profile-evidence*'
          path: precision-evidence
          merge-multiple: true

      - name: Apply requested core wheel build tag before release freeze
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.core_wheel_build_tag != '' }}
        shell: bash
        env:
          CORE_WHEEL_BUILD_TAG: ${{ inputs.core_wheel_build_tag }}
        run: |
          set -euo pipefail
          python .github/scripts/retag_wheel_build.py \
            --build-tag "$CORE_WHEEL_BUILD_TAG" \
            --remove-original \
            dist/gafime-*.whl

      - name: Verify requested retagged Core wheels install as exact archives
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.core_wheel_build_tag != '' }}
        shell: bash
        run: |
          set -euo pipefail
          for wheel in dist/gafime-*.whl; do
            install_root="$(mktemp -d "$RUNNER_TEMP/gafime-retag-install-XXXXXX")"
            python -m installer --destdir "$install_root" "$wheel"
            sha256sum "$wheel"
          done

      - name: Bind profile machine code to exact downloaded payload wheels
        run: >-
          python tests/release_measure/gpu_static_kernel_report.py
          --verify-wheel-evidence dist
          --evidence-dir precision-evidence

      - name: Validate complete release bundle
        run: >-
          python tests/release_measure/artifact_01_release_composition.py
          --scope full-release
          --artifacts dist

      - name: Write immutable bundle provenance and checksums
        run: >-
          python .github/scripts/release_bundle.py create
          --artifacts dist
          --source-sha "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID"
          --repository "$GITHUB_REPOSITORY"

      - name: Freeze validated release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/release-bundle-provenance.json
