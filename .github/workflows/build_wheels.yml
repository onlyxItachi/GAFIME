name: Build and Publish Wheels

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_pypi_core:
        description: "Publish the base gafime distribution to PyPI from this run"
        required: false
        type: boolean
        default: false
      publish_pypi_cuda:
        description: "Publish the gafime-cuda payload distribution to PyPI from this run"
        required: false
        type: boolean
        default: false
      publish_pypi_rocm:
        description: "Publish the gafime-rocm payload distribution to PyPI from this run"
        required: false
        type: boolean
        default: false
      publish_pypi_core_sdist:
        description: "Include the base gafime source distribution in the PyPI upload"
        required: false
        type: boolean
        default: true
      core_wheel_build_tag:
        description: "Optional wheel build tag for base gafime wheels, used when PyPI has blocked reused/deleted filenames"
        required: false
        type: string
        default: ""

env:
  CUDA_VERSION: '13.3.0'
  ROCM_VERSION: '7.2.3'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        # ubuntu-latest = Linux x86_64
        # windows-latest = Windows x86_64
        # macos-14 = macOS arm64 (Apple Silicon)

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel>=2.22.0"

      - name: Cache Rust
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/cpu/gafime_cpu/target
          key: rust-${{ runner.os }}-${{ hashFiles('src/cpu/gafime_cpu/Cargo.lock', 'src/cpu/gafime_cpu/Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Stage bundled Metal payload
        if: runner.os == 'macOS'
        run: python .github/scripts/stage_metal_payload.py
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_MACOS: "arm64"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_BEFORE_ALL_LINUX: "curl https://sh.rustup.rs -sSf | sh -s -- -y && . $HOME/.cargo/env"
          CIBW_BEFORE_ALL_MACOS: "curl https://sh.rustup.rs -sSf | sh -s -- -y && source $HOME/.cargo/env"
          CIBW_BEFORE_ALL_WINDOWS: "rustup default stable"
          CIBW_BEFORE_BUILD_WINDOWS: "pip install delvewheel"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair -w {dest_dir} {wheel}"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_ENVIRONMENT: "GAFIME_SKIP_CUDA=1 GAFIME_SKIP_ROCM=1 STRICT_CPU=1 PATH=$HOME/.cargo/bin:$PATH"
          CIBW_ENVIRONMENT_LINUX: "GAFIME_SKIP_CUDA=1 GAFIME_SKIP_ROCM=1 STRICT_CPU=1 PATH=$HOME/.cargo/bin:$PATH"
          CIBW_ENVIRONMENT_MACOS: "GAFIME_SKIP_CUDA=1 GAFIME_SKIP_ROCM=1 STRICT_CPU=1 MACOSX_DEPLOYMENT_TARGET=11.0 PATH=$HOME/.cargo/bin:$PATH"
          CIBW_ENVIRONMENT_WINDOWS: "GAFIME_SKIP_CUDA=1 GAFIME_SKIP_ROCM=1 STRICT_CPU=1"
          CIBW_TEST_REQUIRES: ""
          CIBW_TEST_COMMAND: 'python "{project}/tests/release_measure/installed_wheel_smoke.py" --source-root "{project}"'
          CIBW_TEST_COMMAND_MACOS: 'python "{project}/tests/release_measure/installed_wheel_smoke.py" --source-root "{project}" && python "{project}/tests/release_measure/installed_payload_smoke.py" --source-root "{project}" --backend metal --execute-metal'

      - name: List wheel contents
        shell: bash
        run: |
          for whl in wheelhouse/*.whl; do
            echo "=== $(basename "$whl") ==="
            python -m zipfile -l "$whl" | grep -E '\.(so|dll|dylib|pyd|metallib)$' || echo '  (no native binaries found!)'
            if python -m zipfile -l "$whl" | grep -E 'gafime_cuda|gafime_rocm|libgafime_cuda|libgafime_rocm'; then
              echo "Base gafime wheel must not contain CUDA or ROCm payload packages"
              exit 1
            fi
            if [ "${{ runner.os }}" = "macOS" ]; then
              python -m zipfile -l "$whl" | grep -E 'gafime/_metal/libgafime_metal_v1\.dylib' || {
                echo "macOS arm64 base wheel is missing the bundled Metal dylib"
                exit 1
              }
              python -m zipfile -l "$whl" | grep -E 'gafime/_metal/gafime_metal_v1\.metallib' || {
                echo "macOS arm64 base wheel is missing the bundled Metal metallib"
                exit 1
              }
            fi
            echo
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_arm_linux_wheels:
    name: Build ARM Linux wheels
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          architecture: 'arm64'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel>=2.22.0"

      - name: Cache Rust
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/cpu/gafime_cpu/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/cpu/gafime_cpu/Cargo.lock', 'src/cpu/gafime_cpu/Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-

      - name: Build ARM Linux wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_LINUX: "aarch64"
          CIBW_MANYLINUX_AARCH64_IMAGE: "manylinux_2_28"
          CIBW_BEFORE_ALL_LINUX: "curl https://sh.rustup.rs -sSf | sh -s -- -y && . $HOME/.cargo/env"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_ENVIRONMENT_LINUX: "GAFIME_SKIP_CUDA=1 GAFIME_SKIP_ROCM=1 STRICT_CPU=1 PATH=$HOME/.cargo/bin:$PATH"
          CIBW_TEST_REQUIRES: ""
          CIBW_TEST_COMMAND: 'python "{project}/tests/release_measure/installed_wheel_smoke.py" --source-root "{project}"'

      - name: List wheel contents
        shell: bash
        run: |
          for whl in wheelhouse/*.whl; do
            echo "=== $(basename "$whl") ==="
            python -m zipfile -l "$whl" | grep -E '\.(so|dll|dylib|pyd|metallib)$' || echo '  (no native binaries found!)'
            if python -m zipfile -l "$whl" | grep -E 'gafime_cuda|gafime_rocm|libgafime_cuda|libgafime_rocm'; then
              echo "ARM Linux wheel must not contain CUDA or ROCm payload packages"
              exit 1
            fi
            echo
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cibw-wheels-ubuntu-24.04-arm
          path: ./wheelhouse/*.whl

  build_arm_windows_wheels:
    name: Build ARM Windows wheels
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          architecture: 'arm64'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: arm64

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel>=2.22.0"

      - name: Cache Rust
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/cpu/gafime_cpu/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/cpu/gafime_cpu/Cargo.lock', 'src/cpu/gafime_cpu/Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-

      - name: Build ARM Windows wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_ARCHS_WINDOWS: "ARM64"
          CIBW_BEFORE_ALL_WINDOWS: "rustup default stable"
          CIBW_BEFORE_BUILD_WINDOWS: "pip install delvewheel"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair -w {dest_dir} {wheel}"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_ENVIRONMENT_WINDOWS: "GAFIME_SKIP_CUDA=1 GAFIME_SKIP_ROCM=1 STRICT_CPU=1"
          CIBW_TEST_REQUIRES: ""
          CIBW_TEST_COMMAND: 'python "{project}/tests/release_measure/installed_wheel_smoke.py" --source-root "{project}"'

      - name: List wheel contents
        shell: bash
        run: |
          for whl in wheelhouse/*.whl; do
            echo "=== $(basename "$whl") ==="
            python -m zipfile -l "$whl" | grep -E '\.(so|dll|dylib|pyd|metallib)$' || echo '  (no native binaries found!)'
            if python -m zipfile -l "$whl" | grep -E 'gafime_cuda|gafime_rocm|libgafime_cuda|libgafime_rocm'; then
              echo "ARM Windows wheel must not contain CUDA or ROCm payload packages"
              exit 1
            fi
            echo
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cibw-wheels-windows-11-arm
          path: ./wheelhouse/*.whl

  build_cuda_payload_wheels:
    name: Build CUDA ${{ matrix.platform.label }} payload wheels
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Cache CUDA Toolkit (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cuda-cache
        with:
          path: |
            C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA
          key: cuda-windows-${{ env.CUDA_VERSION }}

      - name: Setup CUDA Toolkit (Windows)
        if: runner.os == 'Windows' && steps.cuda-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "cuda-$env:CUDA_VERSION-network.exe"
          $url = "https://developer.download.nvidia.com/compute/cuda/$env:CUDA_VERSION/network_installers/cuda_$($env:CUDA_VERSION)_windows_network.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $componentVersion = (($env:CUDA_VERSION -split '\.')[0..1] -join '.')
          $process = Start-Process -FilePath $installer -ArgumentList @(
            "-s",
            "nvcc_$componentVersion",
            "crt_$componentVersion",
            "cudart_$componentVersion"
          ) -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) {
            throw "CUDA Toolkit installer exited with code $($process.ExitCode)"
          }

      - name: Add CUDA to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cudaRoot = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.3"
          $cudaLink = "C:\cuda-13.3"
          if (!(Test-Path $cudaRoot)) {
            throw "CUDA Toolkit not found at $cudaRoot"
          }
          if (!(Test-Path $cudaLink)) {
            New-Item -ItemType Junction -Path $cudaLink -Target $cudaRoot | Out-Null
          }
          "$cudaLink\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CUDA_PATH=$cudaLink" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel>=2.22.0"

      - name: Stage CUDA payload source
        run: python .github/scripts/stage_gpu_payload.py cuda payload-src/gafime-cuda

      - name: Build CUDA payload wheels
        run: python -m cibuildwheel payload-src/gafime-cuda --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp310-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_BEFORE_ALL_LINUX: "rpm --import https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/D42D0685.pub && curl -fsSL https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo -o /etc/yum.repos.d/cuda-rhel8.repo && dnf clean all && dnf install -y cuda-nvcc-13-3 cuda-cudart-devel-13-3 && ln -sfn /usr/local/cuda-13.3 /usr/local/cuda"
          CIBW_BEFORE_BUILD_WINDOWS: "pip install delvewheel"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair -w {dest_dir} {wheel}"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_ENVIRONMENT_LINUX: "CUDA_HOME=/usr/local/cuda CUDA_PATH=/usr/local/cuda PATH=/usr/local/cuda/bin:$PATH LD_LIBRARY_PATH=/usr/local/cuda/lib64:$LD_LIBRARY_PATH"
          CIBW_ENVIRONMENT_WINDOWS: 'CUDA_PATH=C:\cuda-13.3'
          CIBW_TEST_COMMAND: ""

      - name: List CUDA payload wheel contents
        shell: bash
        run: |
          for whl in wheelhouse/*.whl; do
            echo "=== $(basename "$whl") ==="
            python -m zipfile -l "$whl" | grep -E 'gafime_cuda/(libgafime_cuda\.so|gafime_cuda\.dll|gafime_cuda\.pyd)' || {
              echo "CUDA payload wheel does not contain the CUDA native library"
              exit 1
            }
            if python -m zipfile -l "$whl" | grep -E 'gafime_rocm|libgafime_rocm'; then
              echo "CUDA payload wheel must not contain ROCm payloads"
              exit 1
            fi
            echo
          done

      - name: Upload CUDA payload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cibw-cuda-${{ matrix.platform.label }}-wheels
          path: ./wheelhouse/*.whl

  build_rocm_linux_payload_wheels:
    name: Build ROCm Linux payload wheels with ROCm 7.2.3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel>=2.22.0"

      - name: Stage ROCm payload source
        run: python .github/scripts/stage_gpu_payload.py rocm payload-src/gafime-rocm

      - name: Build and repair ROCm payload wheel
        run: python -m cibuildwheel payload-src/gafime-rocm --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp310-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_BEFORE_ALL_LINUX: >-
            printf '[rocm]\nname=ROCm 7.2.3\nbaseurl=https://repo.radeon.com/rocm/el8/7.2.3/main\nenabled=1\ngpgcheck=1\ngpgkey=https://repo.radeon.com/rocm/rocm.gpg.key\n'
            > /etc/yum.repos.d/rocm.repo &&
            rpm --import https://repo.radeon.com/rocm/rocm.gpg.key &&
            dnf install -y --setopt=install_weak_deps=False hip-devel7.2.3 rocm-device-libs7.2.3 libstdc++-devel &&
            dnf clean all
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair --plat manylinux_2_28_x86_64 -w {dest_dir} {wheel}"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_ENVIRONMENT_LINUX: "ROCM_PATH=/opt/rocm-7.2.3 HIP_PATH=/opt/rocm-7.2.3 PATH=/opt/rocm-7.2.3/bin:$PATH LD_LIBRARY_PATH=/opt/rocm-7.2.3/lib:$LD_LIBRARY_PATH GAFIME_ROCM_ARCHS=linux-release"
          CIBW_TEST_COMMAND: ""

      - name: List ROCm payload wheel contents
        shell: bash
        run: |
          for whl in wheelhouse/*.whl; do
            echo "=== $(basename "$whl") ==="
            if [[ "$(basename "$whl")" == *linux_x86_64.whl ]]; then
              echo "ROCm payload wheel has an unsupported raw linux_x86_64 platform tag"
              exit 1
            fi
            if [[ "$(basename "$whl")" != *manylinux_2_28_x86_64.whl ]]; then
              echo "ROCm payload wheel must use the manylinux_2_28_x86_64 platform tag"
              exit 1
            fi
            python -m zipfile -l "$whl" | grep -E 'gafime_rocm/(libgafime_rocm\.so|gafime_rocm\.dll|gafime_rocm\.pyd)' || {
              echo "ROCm payload wheel does not contain the ROCm native library"
              exit 1
            }
            if python -m zipfile -l "$whl" | grep -E 'gafime_cuda|libgafime_cuda'; then
              echo "ROCm payload wheel must not contain CUDA payloads"
              exit 1
            fi
            echo
          done

      - name: Upload ROCm payload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cibw-rocm-linux-wheels
          path: ./wheelhouse/*.whl

  validate_wheels:
    name: Validate installed wheel on ${{ matrix.label }}
    needs: [build_wheels, build_arm_linux_wheels, build_arm_windows_wheels]
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-latest
            python_arch: x64
            artifact: cibw-wheels-ubuntu-latest-0
            wheel_pattern: "gafime-*-cp310-abi3-manylinux_2_28_x86_64.whl"
          - label: linux-aarch64
            os: ubuntu-24.04-arm
            python_arch: arm64
            artifact: cibw-wheels-ubuntu-24.04-arm
            wheel_pattern: "gafime-*-cp310-abi3-manylinux_2_28_aarch64.whl"
          - label: macos-arm64
            os: macos-14
            python_arch: arm64
            artifact: cibw-wheels-macos-14-2
            wheel_pattern: "gafime-*-cp310-abi3-macosx_11_0_arm64.whl"
          - label: windows-amd64
            os: windows-latest
            python_arch: x64
            artifact: cibw-wheels-windows-latest-1
            wheel_pattern: "gafime-*-cp310-abi3-win_amd64.whl"
          - label: windows-arm64
            os: windows-11-arm
            python_arch: arm64
            artifact: cibw-wheels-windows-11-arm
            wheel_pattern: "gafime-*-cp310-abi3-win_arm64.whl"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python_arch }}

      - name: Download wheel artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.artifact }}
          path: wheelhouse

      - name: Install built wheel
        shell: bash
        run: |
          set -euo pipefail
          wheels=(wheelhouse/${{ matrix.wheel_pattern }})
          if [ "${#wheels[@]}" -ne 1 ] || [ ! -f "${wheels[0]}" ]; then
            echo "Expected exactly one wheel for ${{ matrix.wheel_pattern }}"
            find wheelhouse -maxdepth 1 -type f -name '*.whl' -print
            exit 1
          fi
          python -m pip install --upgrade pip
          python -m pip install "${wheels[0]}"

      - name: Probe clean installed wheel
        shell: bash
        run: |
          set -euo pipefail
          cp tests/release_measure/installed_wheel_smoke.py "$RUNNER_TEMP/installed_wheel_smoke.py"
          cd "$RUNNER_TEMP"
          python installed_wheel_smoke.py --source-root "$GITHUB_WORKSPACE"

      - name: Probe installed bundled Metal payload
        if: matrix.label == 'macos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          cp tests/release_measure/installed_payload_smoke.py "$RUNNER_TEMP/installed_payload_smoke.py"
          cd "$RUNNER_TEMP"
          python installed_payload_smoke.py \
            --source-root "$GITHUB_WORKSPACE" \
            --backend metal \
            --execute-metal

  validate_cuda_payload_wheels:
    name: Validate installed ${{ matrix.label }} payload artifacts
    needs: [build_wheels, build_cuda_payload_wheels]
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: cuda-linux
            os: ubuntu-latest
            base_artifact: cibw-wheels-ubuntu-latest-0
            base_pattern: "gafime-*-cp310-abi3-manylinux_2_28_x86_64.whl"
            payload_artifact: cibw-cuda-linux-wheels
            payload_pattern: "gafime_cuda-*-cp310-abi3-*.whl"
            backend: cuda
          - label: cuda-windows
            os: windows-latest
            base_artifact: cibw-wheels-windows-latest-1
            base_pattern: "gafime-*-cp310-abi3-win_amd64.whl"
            payload_artifact: cibw-cuda-windows-wheels
            payload_pattern: "gafime_cuda-*-cp310-abi3-*.whl"
            backend: cuda
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Setup MSVC ABI tools (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Download base wheel artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.base_artifact }}
          path: base-wheelhouse

      - name: Download payload wheel artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.payload_artifact }}
          path: payload-wheelhouse

      - name: Install exact base and payload artifacts
        shell: bash
        run: |
          set -euo pipefail
          base_wheels=(base-wheelhouse/${{ matrix.base_pattern }})
          payload_wheels=(payload-wheelhouse/${{ matrix.payload_pattern }})
          if [ "${#base_wheels[@]}" -ne 1 ] || [ ! -f "${base_wheels[0]}" ]; then
            echo "Expected exactly one base wheel for ${{ matrix.base_pattern }}"
            find base-wheelhouse -type f -name '*.whl' -print
            exit 1
          fi
          if [ "${#payload_wheels[@]}" -ne 1 ] || [ ! -f "${payload_wheels[0]}" ]; then
            echo "Expected exactly one payload wheel for ${{ matrix.payload_pattern }}"
            find payload-wheelhouse -type f -name '*.whl' -print
            exit 1
          fi
          python -m pip install --upgrade pip
          python -m pip install "${base_wheels[0]}" "${payload_wheels[0]}"

      - name: Probe clean installed payload discovery and ABI
        shell: bash
        run: |
          set -euo pipefail
          cp tests/release_measure/installed_payload_smoke.py "$RUNNER_TEMP/installed_payload_smoke.py"
          cd "$RUNNER_TEMP"
          python installed_payload_smoke.py \
            --source-root "$GITHUB_WORKSPACE" \
            --backend "${{ matrix.backend }}"

  validate_rocm_payload_wheels:
    name: Validate installed ROCm Linux payload artifact
    needs: [build_wheels, build_rocm_linux_payload_wheels]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Download base wheel artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cibw-wheels-ubuntu-latest-0
          path: base-wheelhouse

      - name: Download ROCm payload wheel artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cibw-rocm-linux-wheels
          path: payload-wheelhouse

      - name: Install exact base and ROCm payload artifacts
        shell: bash
        run: |
          set -euo pipefail
          base_wheels=(base-wheelhouse/gafime-*-cp310-abi3-manylinux_2_28_x86_64.whl)
          payload_wheels=(payload-wheelhouse/gafime_rocm-*-cp310-abi3-*.whl)
          if [ "${#base_wheels[@]}" -ne 1 ] || [ ! -f "${base_wheels[0]}" ]; then
            echo "Expected exactly one Linux x86_64 base wheel"
            find base-wheelhouse -type f -name '*.whl' -print
            exit 1
          fi
          if [ "${#payload_wheels[@]}" -ne 1 ] || [ ! -f "${payload_wheels[0]}" ]; then
            echo "Expected exactly one ROCm payload wheel"
            find payload-wheelhouse -type f -name '*.whl' -print
            exit 1
          fi
          python -m pip install --upgrade pip
          python -m pip install "${base_wheels[0]}" "${payload_wheels[0]}"

      - name: Probe clean installed ROCm payload discovery and ABI
        shell: bash
        run: |
          set -euo pipefail
          cp tests/release_measure/installed_payload_smoke.py "$RUNNER_TEMP/installed_payload_smoke.py"
          cd "$RUNNER_TEMP"
          python installed_payload_smoke.py \
            --source-root "$GITHUB_WORKSPACE" \
            --backend rocm

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build sdist
        run: pipx run build --sdist

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  build_cuda_payload_sdist:
    name: Build CUDA payload source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install build
        run: python -m pip install build tomli

      - name: Stage CUDA payload source
        run: python .github/scripts/stage_gpu_payload.py cuda payload-src/gafime-cuda

      - name: Build CUDA payload sdist
        run: python -m build --sdist payload-src/gafime-cuda --outdir dist

      - name: Validate payload sdist contents
        shell: bash
        run: |
          set -euo pipefail
          tar -tf dist/gafime_cuda-*.tar.gz | grep -E 'src/cuda/kernels\.cu'
          tar -tf dist/gafime_cuda-*.tar.gz | grep -E 'src/cuda/rt_kernels\.cu'
          tar -tf dist/gafime_cuda-*.tar.gz | grep -E 'src/cuda/launcher\.cu'
          tar -tf dist/gafime_cuda-*.tar.gz | grep -E 'src/cuda/rt_launcher\.cu'
          tar -tf dist/gafime_cuda-*.tar.gz | grep -E 'src/cuda/cuda_api\.hpp'
          tar -tf dist/gafime_cuda-*.tar.gz | grep -E 'src/cuda/kernels\.cuh'
          tar -tf dist/gafime_cuda-*.tar.gz | grep -E 'src/cuda/rt_kernels\.cuh'
          tar -tf dist/gafime_cuda-*.tar.gz | grep -E 'src/cuda/rt_launcher\.cuh'
          tar -tf dist/gafime_cuda-*.tar.gz | grep -E 'src/common/gafime_gpu_abi\.hpp'
          tar -tf dist/gafime_cuda-*.tar.gz | grep -E 'gafime_cuda/__init__\.py'
          if tar -tf dist/gafime_cuda-*.tar.gz | grep -E 'gafime_rocm|src/rocm|libgafime_rocm'; then
            echo "CUDA payload source must not contain ROCm payloads"
            exit 1
          fi
      - name: Upload CUDA payload sdist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cibw-cuda-sdist
          path: dist/gafime_cuda-*.tar.gz

  build_rocm_payload_sdist:
    name: Build ROCm payload source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install build
        run: python -m pip install build tomli

      - name: Stage ROCm payload source
        run: python .github/scripts/stage_gpu_payload.py rocm payload-src/gafime-rocm

      - name: Build ROCm payload sdist
        run: python -m build --sdist payload-src/gafime-rocm --outdir dist

      - name: Validate ROCm payload sdist contents
        shell: bash
        run: |
          set -euo pipefail
          tar -tf dist/gafime_rocm-*.tar.gz | grep -E 'src/rocm/kernels\.hip'
          tar -tf dist/gafime_rocm-*.tar.gz | grep -E 'src/rocm/launcher\.hip'
          tar -tf dist/gafime_rocm-*.tar.gz | grep -E 'src/rocm/rocm_api\.hpp'
          tar -tf dist/gafime_rocm-*.tar.gz | grep -E 'src/common/gafime_gpu_abi\.hpp'
          tar -tf dist/gafime_rocm-*.tar.gz | grep -E 'gafime_rocm/__init__\.py'
          if tar -tf dist/gafime_rocm-*.tar.gz | grep -E 'gafime_cuda|src/cuda|libgafime_cuda'; then
            echo "ROCm payload source must not contain CUDA payloads"
            exit 1
          fi

      - name: Upload ROCm payload sdist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cibw-rocm-sdist
          path: dist/gafime_rocm-*.tar.gz

  release:
    name: Publish to GitHub Releases
    needs:
      - build_wheels
      - build_arm_linux_wheels
      - build_arm_windows_wheels
      - build_cuda_payload_wheels
      - build_rocm_linux_payload_wheels
      - validate_wheels
      - validate_cuda_payload_wheels
      - validate_rocm_payload_wheels
      - build_sdist
      - build_cuda_payload_sdist
      - build_rocm_payload_sdist
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Release Note
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          files: dist/*

  publish_pypi_core:
    name: Publish base package to PyPI
    needs:
      - build_wheels
      - build_arm_linux_wheels
      - build_arm_windows_wheels
      - validate_wheels
      - build_sdist
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_pypi_core == true)
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Select base package distributions
        shell: bash
        env:
          CORE_WHEEL_BUILD_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.core_wheel_build_tag || '' }}
          PUBLISH_CORE_SDIST: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_pypi_core_sdist }}
        run: |
          set -euo pipefail
          mkdir -p publish-core
          find dist -type f -name 'gafime-*.whl' -exec cp {} publish-core/ \;
          if [ "$PUBLISH_CORE_SDIST" = "true" ]; then
            find dist -type f -name 'gafime-*.tar.gz' -exec cp {} publish-core/ \;
          else
            echo "Skipping base source distribution upload for this run."
          fi
          if find publish-core -type f | grep -E 'gafime_(cuda|rocm)-'; then
            echo "Base PyPI lane must not contain vendor payload distributions"
            exit 1
          fi
          if [ -n "$CORE_WHEEL_BUILD_TAG" ]; then
            python .github/scripts/retag_wheel_build.py --build-tag "$CORE_WHEEL_BUILD_TAG" --remove-original publish-core/*.whl
          fi
          count="$(find publish-core -type f | wc -l)"
          if [ "$count" -eq 0 ]; then
            echo "No base gafime distributions selected"
            exit 1
          fi
          find publish-core -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Publish base package to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: publish-core/
          skip-existing: true

  publish_pypi_cuda:
    name: Publish CUDA payload to PyPI
    needs:
      - build_cuda_payload_wheels
      - validate_cuda_payload_wheels
      - build_cuda_payload_sdist
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_pypi_cuda == true)
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Select CUDA payload distributions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish-cuda
          find dist -type f \( -name 'gafime_cuda-*.whl' -o -name 'gafime_cuda-*.tar.gz' \) -exec cp {} publish-cuda/ \;
          if find publish-cuda -type f | grep -E 'gafime_rocm-'; then
            echo "CUDA PyPI lane must not contain ROCm payload distributions"
            exit 1
          fi
          count="$(find publish-cuda -type f | wc -l)"
          if [ "$count" -eq 0 ]; then
            echo "No gafime-cuda distributions selected"
            exit 1
          fi
          find publish-cuda -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Publish CUDA payload to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: publish-cuda/
          skip-existing: true

  publish_pypi_rocm:
    name: Publish ROCm payload to PyPI
    needs:
      - build_rocm_linux_payload_wheels
      - validate_rocm_payload_wheels
      - build_rocm_payload_sdist
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_pypi_rocm == true)
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Select ROCm payload distributions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish-rocm
          find dist -type f \( -name 'gafime_rocm-*.whl' -o -name 'gafime_rocm-*.tar.gz' \) -exec cp {} publish-rocm/ \;
          if find publish-rocm -type f | grep -E 'gafime_cuda-'; then
            echo "ROCm PyPI lane must not contain CUDA payload distributions"
            exit 1
          fi
          count="$(find publish-rocm -type f | wc -l)"
          if [ "$count" -eq 0 ]; then
            echo "No gafime-rocm distributions selected"
            exit 1
          fi
          find publish-rocm -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Publish ROCm payload to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: publish-rocm/
          skip-existing: true
