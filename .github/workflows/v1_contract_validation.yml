name: V1 Contract Validation

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cuda_native_source_contract:
    name: CUDA 13.3 native source and lifecycle fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Compile and run RT-free native fixtures
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            nvidia/cuda:13.3.0-devel-ubuntu24.04 \
            bash -lc '
              set -euo pipefail
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cmake g++
              cmake -S src/cuda -B build/ci-cuda-native \
                -DGAFIME_CUDA_RT_BUILD_MODE=off \
                -DGAFIME_CUDA_BUILD_TESTS=ON \
                -DGAFIME_CUDA_ARCHITECTURES=89-real
              cmake --build build/ci-cuda-native --parallel 2
              ctest --test-dir build/ci-cuda-native --show-only \
                | grep gafime_cuda_precision_abi_smoke
              ctest --test-dir build/ci-cuda-native --output-on-failure \
                --exclude-regex '^gafime_cuda_precision_abi_smoke$'
            '

  contract_and_numpy_parity:
    name: Contract and top-level NumPy parity
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Verify MSRV and release Rust toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.89.0 --profile minimal --component clippy,rustfmt
          cargo +1.89.0 fmt --all -- --check
          cargo +1.89.0 check --workspace --all-targets --locked
          cargo +1.89.0 clippy --workspace --all-targets --locked -- -D warnings
          cargo +1.89.0 test --workspace --locked --quiet
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          cargo +1.97.1 fmt --all -- --check
          cargo +1.97.1 check --workspace --all-targets --locked
          cargo +1.97.1 clippy --workspace --all-targets --locked -- -D warnings
          cargo +1.97.1 test --workspace --locked --quiet

      - name: Install validation package
        shell: bash
        run: |
          set -euo pipefail
          rustup default 1.97.1
          python -m pip install --upgrade pip
          python -m pip install nbformat numpy scikit-learn "polars>=1.3,<2" pytest
          python -m pip install --no-deps .

      - name: Verify contract policy files
        shell: bash
        run: python tests/release_measure/contract_00_policy_files.py

      - name: Verify release-facing docs, skills, and practice notebook
        shell: bash
        run: python tests/release_measure/contract_06_release_facing_artifacts.py

      - name: Verify v1 architecture gate
        shell: bash
        run: python tests/release_measure/v1_architecture_gate.py --skip-cargo

      - name: Verify top-level API NumPy parity
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          python "$GITHUB_WORKSPACE/tests/release_measure/contract_01_top_level_numpy_parity.py"

      - name: Verify feature generation references
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          python "$GITHUB_WORKSPACE/tests/release_measure/contract_02_feature_generation_reference.py"

      - name: Verify public API truthfulness contracts
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          GAFIME_TEST_INSTALLED_PACKAGE=1 python -m pytest -q --rootdir=/tmp \
            "$GITHUB_WORKSPACE/tests/python"

      - name: Verify compiled plan and eager value parity
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          python "$GITHUB_WORKSPACE/tests/release_measure/compile_01_plan_correctness.py"
          python "$GITHUB_WORKSPACE/tests/release_measure/compile_02_compiled_vs_eager.py"

  metal_payload_compile:
    name: Metal shader, payload, and v1 API validation
    runs-on: macos-26
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          architecture: arm64

      - name: Inspect Metal toolchain
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          system_profiler SPHardwareDataType SPDisplaysDataType
          xcodebuild -version
          xcrun --find metal
          xcrun --find metallib

      - name: Compile Metal shader directly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/metal-direct
          xcrun -sdk macosx metal \
            -c src/metal/shader.metal \
            -o build/metal-direct/gafime_metal_v1.air
          xcrun -sdk macosx metallib \
            build/metal-direct/gafime_metal_v1.air \
            -o build/metal-direct/gafime_metal_v1.metallib

      - name: Build Metal CMake payload
        shell: bash
        run: |
          set -euo pipefail
          cmake -S src/metal -B build/metal-cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build/metal-cmake --config Release --verbose

      - name: Install v1 package for Metal validation
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          python -m pip install --upgrade pip
          python -m pip install nbformat numpy scikit-learn "polars>=1.3,<2" pytest
          python -m pip install --no-deps .

      - name: Validate installed Metal backend through top-level API
        shell: bash
        env:
          GAFIME_METAL_V1_LIB: ${{ github.workspace }}/build/metal-cmake/libgafime_metal_v1.dylib
          GAFIME_METAL_V1_METALLIB: ${{ github.workspace }}/build/metal-cmake/gafime_metal_v1.metallib
          GAFIME_METAL_PARITY_TOLERANCE: "0.00005"
          GAFIME_TEST_INSTALLED_PACKAGE: "1"
        run: |
          set -euo pipefail
          test -f "$GAFIME_METAL_V1_LIB"
          test -f "$GAFIME_METAL_V1_METALLIB"
          pytest -q tests/python/test_v1_metal.py
          python tests/release_measure/contract_03_family_metric_backend_surface.py
          cargo test -p gafime-gpu-sys metal_execution_memory_peak_tracks_descriptor_and_ranking_state_when_available -- --nocapture
          cargo test -p gafime-gpu-sys metal_descriptor_cache_generation_refreshes_reused_addresses_when_available -- --nocapture
          cargo test -p gafime-gpu-sys metal_device_topk_covers_split_directions_ties_and_large_k_when_available -- --nocapture
          cargo test -p gafime-gpu-sys metal_continuous_metrics_match_cpu_on_high_dynamic_and_nonfinite_inputs_when_available -- --nocapture
          cargo test -p gafime-gpu-sys metal_fp32_precision_metrics_match_core_fp32_on_high_dynamic_and_nonfinite_inputs_when_available -- --nocapture
          cargo test -p gafime-gpu-sys metal_nonfinite_correlation_is_not_laundered_when_library_is_available -- --nocapture
          cargo test -p gafime-gpu-sys metal_scaled_covariance_matches_cpu_across_dynamic_range_when_available -- --nocapture

  release_artifact_composition:
    name: Release source and sdist composition
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install source distribution tooling
        run: python -m pip install build

      - name: Verify release source policy
        run: >-
          python tests/release_measure/artifact_01_release_composition.py
          --scope source-tree

      - name: Build core and standard external GPU source distributions
        shell: bash
        run: |
          set -euo pipefail
          python -m build --sdist --outdir "$RUNNER_TEMP/release-sdists"
          python .github/scripts/stage_gpu_payload.py \
            cuda "$RUNNER_TEMP/gafime-cuda"
          python -m build --sdist "$RUNNER_TEMP/gafime-cuda" \
            --outdir "$RUNNER_TEMP/release-sdists"
          python .github/scripts/stage_gpu_payload.py \
            rocm "$RUNNER_TEMP/gafime-rocm" --rocm-wheel-policy system
          python -m build --sdist "$RUNNER_TEMP/gafime-rocm" \
            --outdir "$RUNNER_TEMP/release-sdists"

      - name: Validate source distribution composition
        run: >-
          python tests/release_measure/artifact_01_release_composition.py
          --scope sdists
          --artifacts "$RUNNER_TEMP/release-sdists"

  docker_source_smoke:
    name: Core source Docker build and runtime smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate CUDA source image definition
        run: docker build --check --file Dockerfile .

      - name: Build core source smoke image
        run: docker build --file Dockerfile.smoketest --tag gafime-core-source-smoke .

      - name: Execute installed container entrypoint
        run: docker run --rm gafime-core-source-smoke
