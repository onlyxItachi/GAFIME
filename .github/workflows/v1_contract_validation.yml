name: V1 Contract Validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract_and_numpy_parity:
    name: Contract and top-level NumPy parity
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install validation package
        shell: bash
        run: |
          set -euo pipefail
          rustup default stable
          python -m pip install --upgrade pip
          python -m pip install numpy scikit-learn polars
          python -m pip install --no-deps .

      - name: Verify contract policy files
        shell: bash
        run: python tests/release_measure/contract_00_policy_files.py

      - name: Verify v1 architecture gate
        shell: bash
        run: python tests/release_measure/v1_architecture_gate.py --skip-cargo

      - name: Verify top-level API NumPy parity
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          python "$GITHUB_WORKSPACE/tests/release_measure/contract_01_top_level_numpy_parity.py"

      - name: Verify feature generation references
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          python "$GITHUB_WORKSPACE/tests/release_measure/contract_02_feature_generation_reference.py"

  metal_payload_compile:
    name: Metal shader and payload compile
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Inspect Metal toolchain
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun --find metal
          xcrun --find metallib

      - name: Compile Metal shader directly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/metal-direct
          xcrun -sdk macosx metal \
            -c src/metal/shader.metal \
            -o build/metal-direct/gafime_metal_v1.air
          xcrun -sdk macosx metallib \
            build/metal-direct/gafime_metal_v1.air \
            -o build/metal-direct/gafime_metal_v1.metallib

      - name: Build Metal CMake payload
        shell: bash
        run: |
          set -euo pipefail
          cmake -S src/metal -B build/metal-cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build/metal-cmake --config Release --verbose
