name: Native Platform Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metal_macos:
    name: Metal macOS installed-wheel validation
    runs-on: macos-26
    timeout-minutes: 120
    env:
      GAFIME_SKIP_CUDA: "1"
      LEGACY_METAL_PAYLOAD_COMMIT: "84758cd6ed2bf91163c5ff652ba8d7a6e6e7870b"
      PRE_GENERATION_METAL_PAYLOAD_COMMIT: "3f4cd842e08c7b6796bd03d0d63b9c100fc7b478"
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      STRICT_CPU: "1"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          architecture: arm64

      - name: Install build tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel
          if ! command -v rustup >/dev/null 2>&1; then
            curl https://sh.rustup.rs -sSf \
              | sh -s -- -y --profile minimal --default-toolchain 1.97.1
          fi
          "$HOME/.cargo/bin/rustup" toolchain install 1.97.1 --profile minimal
          "$HOME/.cargo/bin/rustup" default 1.97.1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build local core wheel with bundled Metal
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.cargo/env" || true
          python .github/scripts/stage_metal_payload.py
          python -m pip wheel . --no-deps -w wheelhouse

      - name: Build pre-immutable same-ABI Metal payload
        shell: bash
        run: |
          set -euo pipefail
          legacy_tree="$RUNNER_TEMP/gafime-pre-immutable-metal"
          git worktree add --detach "$legacy_tree" "$LEGACY_METAL_PAYLOAD_COMMIT"
          python "$legacy_tree/.github/scripts/stage_metal_payload.py" \
            --output "$RUNNER_TEMP/gafime-legacy-metal" \
            --build-dir "$RUNNER_TEMP/gafime-legacy-metal-build"
          git worktree remove "$legacy_tree"

      - name: Build immutable pre-generation same-ABI Metal payload
        shell: bash
        run: |
          set -euo pipefail
          legacy_tree="$RUNNER_TEMP/gafime-pre-generation-metal"
          git worktree add --detach "$legacy_tree" "$PRE_GENERATION_METAL_PAYLOAD_COMMIT"
          python "$legacy_tree/.github/scripts/stage_metal_payload.py" \
            --output "$RUNNER_TEMP/gafime-pre-generation-metal-payload" \
            --build-dir "$RUNNER_TEMP/gafime-pre-generation-metal-build"
          git worktree remove "$legacy_tree"

      - name: Run installed-wheel and Metal payload contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/gafime-native-platform-venv"
          . "$RUNNER_TEMP/gafime-native-platform-venv/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install wheelhouse/gafime-*.whl
          (
            cd /tmp
            python "$GITHUB_WORKSPACE/tests/release_measure/installed_wheel_smoke.py" \
              --source-root "$GITHUB_WORKSPACE"
            python "$GITHUB_WORKSPACE/tests/release_measure/contract_05_capability_surface.py"
            python "$GITHUB_WORKSPACE/tests/release_measure/installed_payload_smoke.py" \
              --source-root "$GITHUB_WORKSPACE" \
              --backend metal \
              --execute-metal
            python "$GITHUB_WORKSPACE/tests/release_measure/precision_01_end_to_end_profiles.py" \
              --backend metal
            python "$GITHUB_WORKSPACE/tests/release_measure/abi_02_legacy_gpu_payload_compatibility.py" \
              --backend metal \
              --legacy-payload "$RUNNER_TEMP/gafime-legacy-metal/libgafime_metal_v1.dylib" \
              --legacy-metallib "$RUNNER_TEMP/gafime-legacy-metal/gafime_metal_v1.metallib"
            python "$GITHUB_WORKSPACE/tests/release_measure/abi_02_legacy_gpu_payload_compatibility.py" \
              --backend metal \
              --legacy-payload "$RUNNER_TEMP/gafime-pre-generation-metal-payload/libgafime_metal_v1.dylib" \
              --legacy-metallib "$RUNNER_TEMP/gafime-pre-generation-metal-payload/gafime_metal_v1.metallib"
          )

      - name: Upload Metal results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-platform-metal-macos26
          path: wheelhouse/*.whl

  arm_linux:
    name: ARM Linux installed-wheel validation
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      GAFIME_SKIP_CUDA: "1"
      STRICT_CPU: "1"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel
          if ! command -v rustup >/dev/null 2>&1; then
            curl https://sh.rustup.rs -sSf \
              | sh -s -- -y --profile minimal --default-toolchain 1.97.1
          fi
          "$HOME/.cargo/bin/rustup" toolchain install 1.97.1 --profile minimal
          "$HOME/.cargo/bin/rustup" default 1.97.1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build local validation wheel
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.cargo/env" || true
          python -m pip wheel . --no-deps -w wheelhouse

      - name: Run installed-wheel capability contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/gafime-native-platform-venv"
          . "$RUNNER_TEMP/gafime-native-platform-venv/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install wheelhouse/*.whl
          (
            cd /tmp
            python "$GITHUB_WORKSPACE/tests/release_measure/installed_wheel_smoke.py" \
              --source-root "$GITHUB_WORKSPACE"
            python "$GITHUB_WORKSPACE/tests/release_measure/contract_05_capability_surface.py"
          )

      - name: Upload ARM Linux results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-platform-arm-linux
          path: wheelhouse/*.whl

  arm_windows:
    name: ARM Windows installed-wheel validation
    runs-on: windows-11-arm
    timeout-minutes: 120
    env:
      GAFIME_SKIP_CUDA: "1"
      STRICT_CPU: "1"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          architecture: arm64

      - name: Install build tooling
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest -Uri https://win.rustup.rs/aarch64 -OutFile rustup-init.exe
            .\rustup-init.exe -y --profile minimal --default-toolchain 1.97.1
          }
          & "$env:USERPROFILE\.cargo\bin\rustup.exe" toolchain install 1.97.1 --profile minimal
          & "$env:USERPROFILE\.cargo\bin\rustup.exe" default 1.97.1
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build local validation wheel
        shell: pwsh
        run: |
          $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
          python -m pip wheel . --no-deps -w wheelhouse

      - name: Run installed-wheel capability contracts
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "gafime-native-platform-venv"
          python -m venv $venv
          & "$venv\Scripts\Activate.ps1"
          python -m pip install --upgrade pip
          $wheel = Get-ChildItem wheelhouse\*.whl | Select-Object -First 1
          python -m pip install $wheel.FullName
          Push-Location $env:TEMP
          python "$env:GITHUB_WORKSPACE\tests\release_measure\installed_wheel_smoke.py" `
            --source-root "$env:GITHUB_WORKSPACE"
          python "$env:GITHUB_WORKSPACE\tests\release_measure\contract_05_capability_surface.py"
          Pop-Location

      - name: Upload ARM Windows results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-platform-arm-windows
          path: wheelhouse/*.whl
