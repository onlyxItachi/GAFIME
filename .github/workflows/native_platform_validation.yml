name: Native Platform Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metal_macos:
    name: Metal macOS smoke and extreme
    runs-on: macos-26
    timeout-minutes: 120
    env:
      GAFIME_SKIP_CUDA: "1"
      STRICT_CPU: "1"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          architecture: arm64

      - name: Install build tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel
          if ! command -v rustup >/dev/null 2>&1; then
            curl https://sh.rustup.rs -sSf | sh -s -- -y
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build local validation wheel
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.cargo/env" || true
          python -m pip wheel . --no-deps -w wheelhouse

      - name: Run installed-wheel smoke and extreme tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p platform-validation-results
          python -m venv .platform-validation-venv
          . .platform-validation-venv/bin/activate
          python -m pip install --upgrade pip pytest
          python -m pip install --no-deps wheelhouse/*.whl
          (
            cd /tmp
            python "$GITHUB_WORKSPACE/tests/test_v045_native_spine.py"
            GAFIME_BENCHMARK_WHEEL="$(find "$GITHUB_WORKSPACE/wheelhouse" -maxdepth 1 -type f -name '*.whl' -print -quit)" \
              python "$GITHUB_WORKSPACE/tests/benchmark_distribution_wheel.py" \
                --label metal-macos26-smoke \
                --output "$GITHUB_WORKSPACE/platform-validation-results/metal-smoke.json"
            python "$GITHUB_WORKSPACE/tests/platform_extreme_validation.py" \
              --label metal-macos26-extreme \
              --backend metal \
              --n-samples 8192 \
              --n-features 18 \
              --max-comb-size 4 \
              --max-combinations-per-k 30000 \
              --max-discrete-candidates 4000 \
              --max-time-series-candidates 1000 \
              --output "$GITHUB_WORKSPACE/platform-validation-results/metal-extreme.json"
            python "$GITHUB_WORKSPACE/tests/metal_hardcore_benchmark.py" \
              --preset beast \
              --output "$GITHUB_WORKSPACE/platform-validation-results/metal-direct-beast.json"
          )

      - name: Upload Metal results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-platform-metal-macos26
          path: |
            platform-validation-results/**
            wheelhouse/*.whl

  arm_linux:
    name: ARM Linux smoke and extreme
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      GAFIME_SKIP_CUDA: "1"
      STRICT_CPU: "1"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel
          if ! command -v rustup >/dev/null 2>&1; then
            curl https://sh.rustup.rs -sSf | sh -s -- -y
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build local validation wheel
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.cargo/env" || true
          python -m pip wheel . --no-deps -w wheelhouse

      - name: Run installed-wheel smoke and extreme tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p platform-validation-results
          python -m venv .platform-validation-venv
          . .platform-validation-venv/bin/activate
          python -m pip install --upgrade pip pytest
          python -m pip install --no-deps wheelhouse/*.whl
          (
            cd /tmp
            python "$GITHUB_WORKSPACE/tests/test_v045_native_spine.py"
            GAFIME_BENCHMARK_WHEEL="$(find "$GITHUB_WORKSPACE/wheelhouse" -maxdepth 1 -type f -name '*.whl' -print -quit)" \
              python "$GITHUB_WORKSPACE/tests/benchmark_distribution_wheel.py" \
                --label arm-linux-smoke \
                --output "$GITHUB_WORKSPACE/platform-validation-results/arm-linux-smoke.json"
            python "$GITHUB_WORKSPACE/tests/platform_extreme_validation.py" \
              --label arm-linux-extreme \
              --backend core \
              --n-samples 8192 \
              --n-features 18 \
              --max-comb-size 4 \
              --max-combinations-per-k 30000 \
              --max-discrete-candidates 4000 \
              --max-time-series-candidates 1000 \
              --output "$GITHUB_WORKSPACE/platform-validation-results/arm-linux-extreme.json"
          )

      - name: Upload ARM Linux results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-platform-arm-linux
          path: |
            platform-validation-results/**
            wheelhouse/*.whl

  arm_windows:
    name: ARM Windows smoke and extreme
    runs-on: windows-11-arm
    timeout-minutes: 120
    env:
      GAFIME_SKIP_CUDA: "1"
      STRICT_CPU: "1"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          architecture: arm64

      - name: Install build tooling
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest -Uri https://win.rustup.rs/aarch64 -OutFile rustup-init.exe
            .\rustup-init.exe -y
          }
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build local validation wheel
        shell: pwsh
        run: |
          $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
          python -m pip wheel . --no-deps -w wheelhouse

      - name: Run installed-wheel smoke and extreme tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path platform-validation-results | Out-Null
          python -m venv .platform-validation-venv
          .\.platform-validation-venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip pytest
          $wheel = Get-ChildItem wheelhouse\*.whl | Select-Object -First 1
          python -m pip install --no-deps $wheel.FullName
          Push-Location $env:TEMP
          python "$env:GITHUB_WORKSPACE\tests\test_v045_native_spine.py"
          $env:GAFIME_BENCHMARK_WHEEL = $wheel.FullName
          python "$env:GITHUB_WORKSPACE\tests\benchmark_distribution_wheel.py" `
            --label arm-windows-smoke `
            --output "$env:GITHUB_WORKSPACE\platform-validation-results\arm-windows-smoke.json"
          python "$env:GITHUB_WORKSPACE\tests\platform_extreme_validation.py" `
            --label arm-windows-extreme `
            --backend core `
            --n-samples 8192 `
            --n-features 18 `
            --max-comb-size 4 `
            --max-combinations-per-k 30000 `
            --max-discrete-candidates 4000 `
            --max-time-series-candidates 1000 `
            --output "$env:GITHUB_WORKSPACE\platform-validation-results\arm-windows-extreme.json"
          Pop-Location

      - name: Upload ARM Windows results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-platform-arm-windows
          path: |
            platform-validation-results/**
            wheelhouse/*.whl
