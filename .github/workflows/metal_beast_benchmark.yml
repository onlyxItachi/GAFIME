      - name: Run installed-wheel Metal beast benchmark
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$METAL_VENV"
          python -m venv "$METAL_BASELINE_VENV"
          "$METAL_VENV/bin/python" -m pip install --upgrade pip
          "$METAL_BASELINE_VENV/bin/python" -m pip install --upgrade pip
          "$METAL_VENV/bin/python" -m pip install numpy "$METAL_WHEELHOUSE"/gafime-*.whl
          "$METAL_BASELINE_VENV/bin/python" -m pip install numpy "$METAL_BASELINE_WHEELHOUSE"/gafime-*.whl
          for python_executable in \
            "$METAL_BASELINE_VENV/bin/python" "$METAL_VENV/bin/python"; do
            "$python_executable" - <<'PY'
          import gafime

          for precision in ("mixed", "fp64"):
              try:
                  gafime.backend_capabilities(
                      "metal", probe=True, precision=precision
                  )
              except ValueError as exc:
                  message = str(exc)
                  assert "Metal supports precision='fp32' only" in message, message
              else:
                  raise AssertionError(
                      f"explicit Metal precision={precision!r} did not fail closed"
                  )
          print("installed-wheel explicit Metal mixed/fp64 rejection: pass")
          PY
          done
          (
            cd /tmp
            case "$BENCH_PRESET" in
              smoke)
                workload_args=(--workload small-latency)
                ;;
              beast)
                workload_args=(--workload release)
                ;;
              absurd)
                workload_args=(--workload release)
                ;;
              *)
                echo "unknown Metal benchmark preset: $BENCH_PRESET" >&2
                exit 2
                ;;
            esac
            baseline_wheels=("$METAL_BASELINE_WHEELHOUSE"/gafime-*.whl)
            candidate_wheels=("$METAL_WHEELHOUSE"/gafime-*.whl)
            test "${#baseline_wheels[@]}" -eq 1
            test "${#candidate_wheels[@]}" -eq 1
            python "$GITHUB_WORKSPACE/tests/release_measure/perf_13_precision_profiles.py" \
              --variant baseline="$METAL_BASELINE_VENV/bin/python" \
              --variant candidate="$METAL_VENV/bin/python" \
              --source-root baseline="$METAL_BASELINE_SOURCE" \
              --source-root candidate="$GITHUB_WORKSPACE" \
              --wheel baseline="${baseline_wheels[0]}" \
              --wheel candidate="${candidate_wheels[0]}" \
              --native-evidence baseline="$METAL_RESULTS_DIR/metal-native-evidence-baseline.json" \
              --native-evidence candidate="$METAL_RESULTS_DIR/metal-native-evidence-candidate.json" \
              --backend metal \
              --profile fp32 \
              --input-policy common-f64,native \
              --warmups 10 \
              --repetitions 30 \
              --min-sample-ms 100 \
              --bootstrap-resamples 2000 \
              --ab-blocks 2 \
              --seed 20260809 \
              "${workload_args[@]}" \
              --output "$METAL_RESULTS_DIR/metal-precision-profiles-${{ matrix.runner_label }}.json"
          )

      - name: Run exact-head canonical cold A/B gate
        shell: bash
        env:
          GITHUB_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # A moved PR head cannot be represented as exact-head hosted evidence,
          # even if this job began on the expected commit.
          python - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request

          expected = os.environ["EXPECTED_CANDIDATE_SHA"]
          checkout = subprocess.run(
              ["git", "rev-parse", "HEAD"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          if checkout != expected:
              raise SystemExit(
                  f"candidate checkout moved from exact head: {checkout} != {expected}"
              )
          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL']}/repos/"
              f"{os.environ['GITHUB_REPOSITORY']}/pulls/70",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_READ_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              live_sha = json.load(response).get("head", {}).get("sha")
          if live_sha != expected:
              raise SystemExit(
                  f"live PR #70 head moved during the build: {live_sha!r} != {expected}"
              )
          PY

          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git -C "$METAL_BASELINE_SOURCE" rev-parse HEAD)" = "$BASELINE_COMMIT"
          test -z "$(git -C "$METAL_BASELINE_SOURCE" status --porcelain=v1 --untracked-files=all)"

          cold_harness="$GITHUB_WORKSPACE/tests/release_measure/cold_lifecycle.py"
          cold_relative="tests/release_measure/cold_lifecycle.py"
          test -f "$cold_harness"
          cold_harness_sha="$(shasum -a 256 "$cold_harness" | awk '{print $1}')"
          cold_harness_blob="$(git hash-object "$cold_harness")"
          cold_head_blob="$(git rev-parse "HEAD:$cold_relative")"
          test "$cold_harness_blob" = "$cold_head_blob"

          baseline_wheels=("$METAL_BASELINE_WHEELHOUSE"/gafime-*.whl)
          candidate_wheels=("$METAL_WHEELHOUSE"/gafime-*.whl)
          test "${#baseline_wheels[@]}" -eq 1
          test "${#candidate_wheels[@]}" -eq 1
          baseline_wheel="$(cd "$(dirname "${baseline_wheels[0]}")" && pwd)/$(basename "${baseline_wheels[0]}")"
          candidate_wheel="$(cd "$(dirname "${candidate_wheels[0]}")" && pwd)/$(basename "${candidate_wheels[0]}")"
          baseline_payload="$METAL_RESULTS_DIR/installed-payload-baseline/gafime/_metal/libgafime_metal_v1.dylib"
          candidate_payload="$METAL_RESULTS_DIR/installed-payload-candidate/gafime/_metal/libgafime_metal_v1.dylib"
          test -x "$METAL_BASELINE_VENV/bin/python"
          test -x "$METAL_VENV/bin/python"
          test -f "$baseline_payload"
          test -f "$candidate_payload"

          for ab_block in 0 1; do
            if [[ "$ab_block" == 0 ]]; then
              variant_order=(baseline candidate)
            else
              variant_order=(candidate baseline)
            fi
            variant_sequence="${variant_order[0]},${variant_order[1]}"
            for variant in "${variant_order[@]}"; do
              if [[ "$variant" == baseline ]]; then
                python_executable="$METAL_BASELINE_VENV/bin/python"
                payload_path="$baseline_payload"
                source_root="$METAL_BASELINE_SOURCE"
                wheel_path="$baseline_wheel"
              else
                python_executable="$METAL_VENV/bin/python"
                payload_path="$candidate_payload"
                source_root="$GITHUB_WORKSPACE"
                wheel_path="$candidate_wheel"
              fi
              cold_output="$METAL_RESULTS_DIR/metal-cold-lifecycle-block-$ab_block-$variant-${{ matrix.runner_label }}.json"
              (
                cd "$RUNNER_TEMP"
                "$python_executable" "$cold_harness" \
                  --backend metal \
                  --payload "$payload_path" \
                  --profile fp32 \
                  --repetitions 30 \
                  --bootstrap-resamples 2000 \
                  --seed 20260809 \
                  --source-root "$source_root" \
                  --wheel "$wheel_path" \
                  --variant "$variant" \
                  --ab-block "$ab_block" \
                  --variant-sequence "$variant_sequence" \
                  --timeout-seconds 300 \
                  --output "$cold_output"
              )
            done
          done

          COLD_HARNESS_SHA="$cold_harness_sha" \
          COLD_HARNESS_BLOB="$cold_harness_blob" \
          COLD_HARNESS_HEAD_BLOB="$cold_head_blob" \
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def sha256(path):
              digest = hashlib.sha256()
              with Path(path).open("rb") as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(block)
              return digest.hexdigest()

          results = Path(os.environ["METAL_RESULTS_DIR"])
          sequences = {0: ["baseline", "candidate"], 1: ["candidate", "baseline"]}
          artifacts = []
          for ab_block in (0, 1):
              for variant in sequences[ab_block]:
                  path = results / (
                      f"metal-cold-lifecycle-block-{ab_block}-{variant}-"
                      "${{ matrix.runner_label }}.json"
                  )
                  record = json.loads(path.read_text(encoding="utf-8"))
                  assert record["schema"] == "gafime.cold-lifecycle.v1"
                  assert record["status"] == "pass"
                  assert record["backend"] == "metal"
                  assert record["profiles"] == ["fp32"]
                  assert record["repetitions_per_profile"] == 30
                  assert record["fresh_subprocess_per_sample"] is True
                  assert record["variant"] == variant
                  assert record["ab_block"] == ab_block
                  assert record["variant_sequence"] == sequences[ab_block]
                  expected_surface = (
                      "precision-typed-v1.1"
                      if variant == "baseline"
                      else "numeric-route-v2"
                  )
                  assert {item["abi_surface"] for item in record["records"]} == {
                      expected_surface
                  }
                  expected_commit = (
                      os.environ["BASELINE_COMMIT"]
                      if variant == "baseline"
                      else os.environ["EXPECTED_CANDIDATE_SHA"]
                  )
                  assert record["provenance"]["source"]["commit"] == expected_commit
                  assert record["provenance"]["benchmark_script"]["sha256"] == (
                      os.environ["COLD_HARNESS_SHA"]
                  )
                  artifacts.append(
                      {
                          "variant": variant,
                          "ab_block": ab_block,
                          "variant_sequence": sequences[ab_block],
                          "path": path.name,
                          "sha256": sha256(path),
                      }
                  )

          manifest = {
              "schema": "gafime.cold-lifecycle-comparison-manifest.v1",
              "backend": "metal",
              "profile": "fp32",
              "baseline_commit": os.environ["BASELINE_COMMIT"],
              "candidate_commit": os.environ["EXPECTED_CANDIDATE_SHA"],
              "harness": {
                  "source_commit": os.environ["EXPECTED_CANDIDATE_SHA"],
                  "relative_path": "tests/release_measure/cold_lifecycle.py",
                  "sha256": os.environ["COLD_HARNESS_SHA"],
                  "current_git_blob": os.environ["COLD_HARNESS_BLOB"],
                  "head_git_blob": os.environ["COLD_HARNESS_HEAD_BLOB"],
              },
              "schedule": [
                  {"ab_block": block, "variant_sequence": sequences[block]}
                  for block in (0, 1)
              ],
              "process_isolation": "fresh_worker_process_per_profile_sample",
              "artifacts": artifacts,
          }
          assert manifest["harness"]["current_git_blob"] == manifest["harness"]["head_git_blob"]
          manifest_path = results / "metal-cold-lifecycle-comparison-manifest.json"
          manifest_path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

          "$METAL_VENV/bin/python" "$cold_harness" \
            --compare-manifest "$METAL_RESULTS_DIR/metal-cold-lifecycle-comparison-manifest.json" \
            --bootstrap-resamples 2000 \
            --seed 20260809 \
            --output "$METAL_RESULTS_DIR/metal-cold-lifecycle-comparison-${{ matrix.runner_label }}.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.request

          comparison = json.loads(
              (
                  Path(os.environ["METAL_RESULTS_DIR"])
                  / "metal-cold-lifecycle-comparison-${{ matrix.runner_label }}.json"
              ).read_text(encoding="utf-8")
          )
          assert comparison["schema"] == "gafime.cold-lifecycle-comparison.v1"
          assert comparison["status"] == "pass", comparison.get("failures")
          assert comparison["valid_for_canonical_cold_lifecycle_claims"] is True
          assert comparison["backend"] == "metal"
          assert comparison["profiles"] == ["fp32"]
          assert comparison["provenance"]["baseline_commit"] == os.environ["BASELINE_COMMIT"]
          assert comparison["provenance"]["candidate_commit"] == os.environ["EXPECTED_CANDIDATE_SHA"]
          assert comparison["schedule"]["blocks"] == [
              {"ab_block": 0, "variant_sequence": ["baseline", "candidate"]},
              {"ab_block": 1, "variant_sequence": ["candidate", "baseline"]},
          ]
          assert comparison["schedule"]["process_isolation"] == (
              "fresh_worker_process_per_profile_sample"
          )
          assert not comparison["failures"]
          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL']}/repos/"
              f"{os.environ['GITHUB_REPOSITORY']}/pulls/70",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_READ_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              live_sha = json.load(response).get("head", {}).get("sha")
          if live_sha != os.environ["EXPECTED_CANDIDATE_SHA"]:
              raise SystemExit(
                  f"live PR #70 head moved during cold evidence: {live_sha!r}"
              )
          exact_head_path = Path(os.environ["METAL_RESULTS_DIR"]) / "exact-pr-head.json"
          exact_head = json.loads(exact_head_path.read_text(encoding="utf-8"))
          exact_head["post_evidence_live_pr_head_sha"] = live_sha
          exact_head["post_evidence_status"] = "pass"
          exact_head_path.write_text(
              json.dumps(exact_head, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(comparison, indent=2, sort_keys=True))
          PY

      - name: Summarize benchmark
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          results_dir = Path(os.environ["METAL_RESULTS_DIR"])
          result_paths = sorted(results_dir.glob("metal-precision-profiles-*.json"))
          if not result_paths:
              raise AssertionError("No benchmark result JSON found")
          result = json.loads(result_paths[0].read_text(encoding="utf-8"))
          if result.get("schema") != "gafime.precision-profile-performance.v2":
              raise AssertionError(f"unexpected perf13 schema: {result.get('schema')!r}")
          if result.get("status") != "pass":
              raise AssertionError(f"perf13 claim gate did not pass: {result.get('status')!r}")
          if result.get("valid_for_performance_claims") is not True:
              raise AssertionError("perf13 result is not valid for performance claims")
          if result.get("valid_for_e2e_performance_claims") is not True:
              raise AssertionError("perf13 result is not valid for E2E performance claims")
          if result.get("valid_for_native_arithmetic_claims") is not True:
              raise AssertionError("perf13 result is not valid for native arithmetic claims")
          if result.get("native_evidence_backend_readiness", {}).get("complete") is not True:
              raise AssertionError("validated Metal native evidence was not accepted")
          if result.get("ab_schedule_readiness", {}).get("complete") is not True:
              raise AssertionError("randomized alternating Metal A/B and B/A schedule was incomplete")
          if result.get("native_ab_schedule_readiness", {}).get("complete") is not True:
              raise AssertionError(
                  "fresh-process native Metal A/B and reversed B/A schedule was incomplete"
              )
          if result.get("comparative_input_readiness", {}).get("complete") is not True:
              raise AssertionError("Metal baseline/candidate inputs or runtime controls were not comparable")
          cold_path = (
              results_dir
              / "metal-cold-lifecycle-comparison-${{ matrix.runner_label }}.json"
          )
          if not cold_path.is_file():
              raise AssertionError("canonical Metal cold A/B comparison is missing")
          cold = json.loads(cold_path.read_text(encoding="utf-8"))
          if cold.get("valid_for_canonical_cold_lifecycle_claims") is not True:
              raise AssertionError(
                  f"canonical Metal cold A/B gate failed: {cold.get('failures')}"
              )
          exact_head = json.loads(
              (results_dir / "exact-pr-head.json").read_text(encoding="utf-8")
          )
          if (
              exact_head.get("expected_candidate_sha")
              != os.environ["EXPECTED_CANDIDATE_SHA"]
              or exact_head.get("checkout_sha")
              != os.environ["EXPECTED_CANDIDATE_SHA"]
              or exact_head.get("live_pr_head_sha")
              != os.environ["EXPECTED_CANDIDATE_SHA"]
              or exact_head.get("post_evidence_live_pr_head_sha")
              != os.environ["EXPECTED_CANDIDATE_SHA"]
              or exact_head.get("post_evidence_status") != "pass"
          ):
              raise AssertionError(f"exact PR-head evidence is incomplete: {exact_head}")
          public_cells = []
          for worker in result.get("results", []):
              if worker.get("kind") != "public" or worker.get("status") != "pass":
                  continue
              workload = worker.get("workload", {}).get("name", "unknown")
              policy = worker.get("input_policy", "unknown")
              for cell in worker.get("cells", []):
                  if cell.get("status") == "pass":
                      public_cells.append((workload, policy, cell))
          if not public_cells:
              raise AssertionError("no passing perf13 Metal public cells")
          native_paths = sorted(results_dir.glob("metal-native-timing-*.json"))
          if len(native_paths) != 8:
              raise AssertionError(
                  "expected two policies times fresh A/B+B/A Metal helper artifacts, "
                  f"got {native_paths}"
              )
          natives = [json.loads(path.read_text(encoding="utf-8")) for path in native_paths]
          if {item.get("input_policy") for item in natives} != {
              "common-f64", "native"
          }:
              raise AssertionError("Metal native input-policy coverage is incomplete")
          summary_path = results_dir / "summary.md"
          with open(summary_path, "w", encoding="utf-8") as fh:
              fh.write(f"# Metal Beast Benchmark: ${{ matrix.runner_label }}\n\n")
              fh.write(f"- perf13 status: `{result.get('status')}`\n")
              fh.write(f"- backend/profile: `metal/fp32`\n")
              fh.write(
                  f"- exact candidate/live PR #70 head: "
                  f"`{os.environ['EXPECTED_CANDIDATE_SHA']}`\n"
              )
              fh.write(f"- valid for E2E claims: `{result.get('valid_for_e2e_performance_claims')}`\n")
              fh.write(
                  "- valid canonical cold lifecycle A/B+B/A gate: "
                  f"`{cold['valid_for_canonical_cold_lifecycle_claims']}`\n"
              )
              fh.write(
                  "- canonical cold samples: `30 fresh subprocesses per "
                  "variant/block/profile`\n"
              )
              fh.write(f"- randomized A/B+B/A schedule: `{result['ab_schedule_readiness']['complete']}`\n")
              fh.write(
                  "- fresh-process native A/B+B/A schedule: "
                  f"`{result['native_ab_schedule_readiness']['complete']}`\n"
              )
              fh.write(f"- comparative inputs: `{result['comparative_input_readiness']['complete']}`\n")
              fh.write(f"- native evidence accepted: `{result['native_evidence_backend_readiness']['complete']}`\n")
              fh.write(f"- combined E2E/native claim ready: `{result.get('valid_for_native_arithmetic_claims')}`\n")
              fh.write(f"- warmups/repetitions: `{result['arguments']['warmups']}/{result['arguments']['repetitions']}`\n")
              fh.write(f"- native GPU timestamp support: `{all(item['gpu_timing_supported'] for item in natives)}`\n")
              fh.write(f"- native rows/candidates: `{natives[0]['workload']['rows']}/{natives[0]['workload']['candidates']}`\n")
              fh.write("- public wall-clock median latency by workload/input/surface:\n")
              for workload, policy, cell in sorted(public_cells, key=lambda item: (item[0], item[1], item[2]["surface"])):
                  median_ms = float(cell["distribution"]["median_ns"]) / 1.0e6
                  fh.write(f"  - `{workload}/{policy}/{cell['surface']}`: `{median_ms:.3f} ms`\n")
              fh.write("- native synchronized Metal timings:\n")
              for native in sorted(
                  natives,
                  key=lambda item: (
                      item["input_policy"], item["ab_block"], item["variant"]
                  ),
              ):
                  for record in native["records"]:
                      fh.write(
                          f"  - `{native['input_policy']}/block-{native['ab_block']}/"
                          f"{native['variant']}/"
                          f"{record['operation']}/{record['metric']}` "
                          f"({record['clock']}): `{float(record['median_us']):.3f} us`\n"
                      )
              fh.write("- canonical cold lifecycle candidate latency deltas:\n")
              for comparison in cold["comparisons"]:
                  aggregate = comparison.get("aggregate")
                  if not aggregate:
                      continue
                  delta = float(aggregate["candidate_latency_delta_percent"])
                  low, high = aggregate[
                      "bootstrap_candidate_latency_delta_95_ci_percent"
                  ]
                  fh.write(
                      f"  - `{comparison['profile']}/{comparison['phase']}` "
                      f"({comparison['comparability']}): `{delta:+.3f}%` "
                      f"(95% bootstrap CI `{float(low):+.3f}%..{float(high):+.3f}%`)\n"
                  )
              if result.get("claim_failures"):
                  fh.write("- claim-gate limitations are retained in the raw perf13 JSON; subset presets are not mislabeled as the full release workload matrix.\n")
          print(summary_path.read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(summary_path.read_text(encoding="utf-8"))
          PY

      - name: Upload Metal beast artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: metal-beast-${{ matrix.runner_label }}
          path: |
            ${{ env.METAL_RESULTS_DIR }}/**
            ${{ env.METAL_WHEELHOUSE }}/*.whl
            ${{ env.METAL_BASELINE_WHEELHOUSE }}/*.whl
