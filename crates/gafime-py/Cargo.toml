[package]
name = "gafime-py"
version.workspace = true
description = "Single Python-native boundary for GAFIME v1"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "gafime_py"
crate-type = ["rlib", "cdylib"]

[features]
default = []

[dependencies]
arrow = { version = "54.3.1", default-features = false, features = ["ffi"] }
gafime-cpu = { path = "../gafime-cpu" }
gafime-gpu-sys = { path = "../gafime-gpu-sys" }
gafime-orchestrator = { path = "../gafime-orchestrator" }
gafime-types = { path = "../gafime-types" }
pyo3 = { version = "0.22", features = ["abi3-py310", "extension-module"] }
