[build-system]
requires = ["setuptools>=77", "wheel", "pybind11", "cmake"]
build-backend = "setuptools.build_meta"

[project]
name = "gafime"
version = "0.4.0"
description = "GPU Accelerated Feature Interaction Mining Engine"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Hamza", email = "hamzausta2222@gmail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "numpy>=1.24",
    "polars>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]
sklearn = [
    "scikit-learn>=1.0",
]
bench = [
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.0",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "catboost>=1.2",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/onlyxItachi/GAFIME"
Repository = "https://github.com/onlyxItachi/GAFIME"
Issues = "https://github.com/onlyxItachi/GAFIME/issues"

[project.scripts]
gafime = "gafime.cli:main"

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_*"
build-frontend = "build"
test-requires = "pytest scikit-learn"
test-command = "pytest {project}/tests"
