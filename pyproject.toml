[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "gafime"
version = "1.0.0a0"
description = "GPU Accelerated Feature Interaction Mining Engine"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Hamza", email = "hamzausta2222@gmail.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "polars>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]
sklearn = [
    "scikit-learn>=1.0",
]
cuda = [
    "gafime-cuda==1.0.0a0; (platform_system == 'Linux' and platform_machine == 'x86_64') or (platform_system == 'Windows' and platform_machine == 'AMD64')",
]
rocm = [
    "gafime-rocm==1.0.0a0; platform_system == 'Linux' and platform_machine == 'x86_64'",
]
bench = [
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.0",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "catboost>=1.2",
]

[project.urls]
Homepage = "https://github.com/onlyxItachi/GAFIME"
Repository = "https://github.com/onlyxItachi/GAFIME"
Issues = "https://github.com/onlyxItachi/GAFIME/issues"

[project.scripts]
gafime = "gafime.cli:main"

[tool.maturin]
manifest-path = "crates/gafime-py/Cargo.toml"
module-name = "gafime.gafime_py"
python-source = "python"
features = ["pyo3/extension-module"]
include = [
    { path = "gafime/_metal/*.dylib", format = "wheel" },
    { path = "gafime/_metal/*.metallib", format = "wheel" },
    { path = "LICENSE", format = "sdist" },
    { path = "README.md", format = "sdist" },
    { path = "Cargo.toml", format = "sdist" },
    { path = "Cargo.lock", format = "sdist" },
    { path = "crates/**", format = "sdist" },
    { path = "src/**", format = "sdist" },
]
[tool.pytest.ini_options]
testpaths = ["tests/python"]
