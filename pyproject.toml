[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "gafime"
version = "1.0.0rc1"
description = "GPU-Accelerated Feature Interaction Mining Engine (GAFIME) with native Rust CPU/SIMD, CUDA, ROCm/HIP, and Metal execution"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Hamza Usta", email = "hamzausta2222@gmail.com"},
]
keywords = [
    "feature-engineering",
    "feature-interactions",
    "machine-learning",
    "hpc",
    "heterogeneous-computing",
    "cuda",
    "rocm",
    "metal",
    "simd",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "polars>=1.3",
]

[project.optional-dependencies]
dev = [
    "nbformat>=5.10",
    "pytest>=7.0",
    "pytest-cov",
]
sklearn = [
    "scikit-learn>=1.0",
]
bench = [
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.0",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "catboost>=1.2",
]

[project.urls]
Homepage = "https://github.com/onlyxItachi/GAFIME"
Repository = "https://github.com/onlyxItachi/GAFIME"
Issues = "https://github.com/onlyxItachi/GAFIME/issues"
Documentation = "https://github.com/onlyxItachi/GAFIME/blob/main/docs/README.md"
Changelog = "https://github.com/onlyxItachi/GAFIME/blob/main/CHANGELOG.md"
Security = "https://github.com/onlyxItachi/GAFIME/security/policy"
Releases = "https://github.com/onlyxItachi/GAFIME/releases"

[project.scripts]
gafime = "gafime.cli:main"

[tool.maturin]
manifest-path = "crates/gafime-py/Cargo.toml"
module-name = "gafime.gafime_py"
python-source = "python"
features = ["pyo3/extension-module"]
no-default-features = true
include = [
    { path = "gafime/_metal/*.dylib", format = "wheel" },
    { path = "gafime/_metal/*.metallib", format = "wheel" },
    { path = "LICENSE", format = "sdist" },
    { path = "README.md", format = "sdist" },
    { path = "Cargo.toml", format = "sdist" },
    { path = "Cargo.lock", format = "sdist" },
    { path = "crates/**", format = "sdist" },
    { path = "src/common/**/*", format = "sdist" },
]
exclude = [
    { path = "crates/gafime-types/src/local_cmake_experiment.rs", format = "sdist" },
    { path = "crates/gafime-gpu-sys/src/local_cmake_experiment.rs", format = "sdist" },
    { path = "crates/gafime-gpu-sys/src/tests/local_cmake_experiment.rs", format = "sdist" },
    { path = "crates/gafime-gpu-sys/tests/local_cmake_experiment_numeric_domain.rs", format = "sdist" },
    { path = "crates/gafime-py/src/generated/local_cmake_experiment.rs", format = "sdist" },
    { path = "crates/gafime-py/src/runtime/local_cmake_experiment.rs", format = "sdist" },
]
[tool.pytest.ini_options]
testpaths = ["tests/python"]
